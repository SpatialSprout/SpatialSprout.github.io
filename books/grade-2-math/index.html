<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>The Interactive Classroom: Grade 2 Math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: full-bleed desk scene; the book is the interface. Glass bars: brand + views top, activity dock and lesson bar bottom. */
:root{
  --bg:#d9d2c4; --glass:rgba(250,251,253,.9); --glass-line:rgba(27,34,54,.12); --ink:#1b2236; --ink-soft:#5d6478;
  --accent:#2a62c9; --stamp:#cf3f2a; --chip:rgba(27,34,54,.07); --sheet:#ffffff; --lesson:#3f7479; --brand:#3f7479; --btn:#ffffff;
  --display:"Zilla Slab",Georgia,serif; --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141821; --glass:rgba(28,33,46,.9); --glass-line:rgba(230,235,245,.12); --ink:#eceff6; --ink-soft:#a2a9bb;
  --accent:#86aefc; --stamp:#ff8a73; --chip:rgba(236,239,246,.08); --sheet:#1d2231; --brand:#7fc4c9; --btn:#262c3d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141821; --glass:rgba(28,33,46,.9); --glass-line:rgba(230,235,245,.12); --ink:#eceff6; --ink-soft:#a2a9bb;
  --accent:#86aefc; --stamp:#ff8a73; --chip:rgba(236,239,246,.08); --sheet:#1d2231; --brand:#7fc4c9; --btn:#262c3d; color-scheme:dark;}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
.stage{position:relative;height:100%;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 30px rgba(15,20,35,.16)}
.topbar{position:absolute;top:10px;left:0;right:0;display:flex;align-items:center;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;font:700 15px var(--display);color:var(--brand);white-space:nowrap}
.brand .mk{width:30px;height:30px;border-radius:50%;background:#3f7479;display:grid;place-items:center}
.brand .mk img{width:24px;height:24px}
.views{display:flex;padding:3px;border-radius:999px;gap:2px}
.views button{border:0;background:transparent;color:var(--ink-soft);font:600 13px var(--body);height:34px;padding:0 13px;border-radius:999px;cursor:pointer}
.views button.on{background:var(--lesson);color:#fff}
.spacer{flex:1}
.badge{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;font:700 14px var(--body);cursor:pointer;color:var(--ink)}
.badge svg{color:var(--stamp)}
.badge.rank{gap:7px}.badge.rank b{font:700 13px var(--body);background:#16a36f;color:#fff;border-radius:999px;padding:2px 8px}
@media (max-width:600px){.badge.rank #rankTxt{display:none}}
.ptsfly{position:absolute;pointer-events:none;font:700 26px var(--display);color:#16a36f;text-shadow:0 2px 0 #fff,0 0 12px #fff;transition:transform 1.1s ease-out,opacity 1.1s ease-out}
.rankrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--glass-line);margin-top:6px}.rankrow.on{background:#e6f7ec;border-color:#16a36f}.rankrow .lv{font:700 15px var(--display)}.rankrow .need{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#16a36f;border-radius:999px}
@media (max-width:600px){.brand .bt{display:none}.brand{padding:0 5px}.views button{padding:0 10px}}
.tip{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;color:var(--ink)}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;width:min(760px,calc(100% - 24px))}
.pill button{flex:none;width:42px;height:42px;border:0;border-radius:999px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.pill button:hover{background:var(--chip)}
.pill button.on{background:var(--chip);color:var(--accent)}
.cap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;cursor:pointer}
.cap .t{font:600 15px/1.2 var(--display);letter-spacing:.01em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .t .n{color:var(--lesson);margin-right:6px}
.dots{display:flex;gap:5px;margin-top:5px;min-height:6px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--glass-line);transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--lesson)}
.dots i.done{background:var(--ink-soft)}
@media (max-width:520px){.pill .wide{display:none}.cap .t{font-size:14px}}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 62px);width:min(760px,calc(100% - 24px));border-radius:22px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px}
.dtop{display:flex;align-items:center;gap:8px;font:700 15px/1.25 var(--display);min-height:22px;padding:0 4px}
.dtop .stars{color:#f2a400;letter-spacing:1px;white-space:nowrap;font-size:17px}
.dtop .stars i{font-style:normal;color:var(--glass-line)}
.dtop .info{min-width:0}
.dbtns{display:flex;flex-wrap:wrap;gap:6px}
.dbtns button{min-height:46px;padding:0 16px;border-radius:14px;border:2px solid var(--lesson);background:var(--btn);color:var(--ink);font:700 15px var(--body);cursor:pointer;flex:0 1 auto;touch-action:manipulation}
.dbtns button.on{background:var(--lesson);color:#fff}
.dbtns button.go{background:#16a36f;border-color:#16a36f;color:#fff}
.dbtns button.big{font-size:19px;min-width:56px}
.dbtns button:disabled{opacity:.38;cursor:default}
.dbtns button:active{transform:translateY(1px)}
@media (max-width:520px){.dbtns button{min-height:42px;padding:0 12px;font-size:14px}.dtop{font-size:14px}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheetwrap{position:fixed;inset:0;z-index:30;background:rgba(10,14,24,.42);display:flex;align-items:flex-end;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheetwrap{align-items:center}}
.sheet{background:var(--sheet);color:var(--ink);border-radius:22px;width:100%;max-width:600px;max-height:82vh;overflow:auto;padding:20px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h2{font:700 28px/1.1 var(--display);margin:0 0 4px;text-wrap:balance}
.sheet .eyebrow{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--lesson)}
.sheet h3{font:700 17px var(--display);margin:16px 0 4px}
.sheet p,.sheet li{max-width:62ch}
.sheet ul{padding-left:20px;margin:4px 0}
.sheet .muted{color:var(--ink-soft);font-size:13px}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.codes span{font:700 12px var(--body);padding:3px 9px;border-radius:999px;background:var(--chip)}
.toclist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.toclist .grp{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:8px 0 0}
.toclist button{width:100%;display:grid;grid-template-columns:2.4em 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 12px;border-radius:14px;border:1px solid var(--glass-line);background:transparent;color:var(--ink);cursor:pointer;font:inherit}
.toclist button:hover{background:var(--chip)}
.toclist .n{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font:700 17px var(--display);color:#fff}
.toclist .tt{font:700 16px/1.15 var(--display)}
.toclist .st{font-size:11px;letter-spacing:.04em;color:var(--ink-soft)}
.toclist .sc{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.toclist .sc.got{color:var(--stamp);font-weight:700}
.close{margin-top:14px;display:flex;justify-content:flex-end}
.close button{height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--glass-line);background:var(--chip);color:var(--ink);font:600 14px var(--body);cursor:pointer}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-soft)}
.loading{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;font:700 22px var(--display);color:var(--brand);transition:opacity .5s;pointer-events:none}
.loading small{font:400 14px var(--body);color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pill button.pg{width:auto;padding:0 9px;gap:4px;display:flex;align-items:center;font:700 12px var(--body);color:var(--ink-soft)}
.pill button.pg:hover{color:var(--ink)}
@media (max-width:640px){.pill button.pg span{display:none}.pill button.pg{padding:0 6px}}
.story{position:absolute;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 66px);width:min(620px,calc(100% - 24px));border-radius:24px;display:flex;overflow:hidden;
  transform:translate(-50%,24px) scale(.97);opacity:0;pointer-events:none;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.3,1.15)}
.story.on{opacity:1;transform:translate(-50%,0) scale(1)}
.story .sbar{flex:none;width:12px;background:linear-gradient(var(--sc,#3f7479),color-mix(in srgb,var(--sc,#3f7479) 55%,#fff))}
.story .sbody{padding:14px 18px 16px}
.story .sey{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--sc,#3f7479)}
.story .stt{font:700 24px/1.12 var(--display);margin:3px 0 6px;text-wrap:balance}
.story .stx{font:400 17px/1.45 var(--body);color:var(--ink)}
@media (max-width:520px){.story .stt{font-size:20px}.story .stx{font-size:15px}}
</style>

<main class="stage" id="stage">
  <div class="loading" id="loading"><div>SpatialSprout 3D</div><small>Opening The Interactive Classroom…</small></div>
  <div class="topbar">
    <div class="brand glass" aria-label="SpatialSprout 3D"><span class="mk"><img id="brandMark" alt=""></span><span class="bt">SpatialSprout 3D</span></div>
    <div class="views glass" role="group" aria-label="Camera view">
      <button type="button" data-view="read">Read</button>
      <button type="button" data-view="book">Book</button>
      <button type="button" data-view="model">Model</button>
    </div>
    <div class="spacer"></div>
    <button class="badge glass rank" id="rankPill" type="button" aria-label="Points and rank"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21V11" stroke="#16a36f" stroke-width="2.4" stroke-linecap="round"/><path d="M12 12C12 7 8 4 3 4c0 5 3 8 9 8Z" fill="#3fbf5f"/><path d="M12 10c0-4 3-7 9-7 0 5-3 7-9 7Z" fill="#8fe39a"/></svg><span id="rankTxt">Seed</span><b id="ptsTxt">0</b></button>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m12 7 1.5 3.2 3.5.4-2.6 2.4.7 3.5L12 14.8 8.9 16.5l.7-3.5L7 10.6l3.5-.4z" fill="currentColor" stroke="none"/></svg>
      <span id="stampCount">0</span>
    </button>
  </div>
  <div class="story glass" id="story" aria-live="polite"><div class="sbar"></div><div class="sbody"><div class="sey" id="stEy"></div><div class="stt" id="stTt"></div><div class="stx" id="stTx"></div></div></div>
  <div class="tip glass" id="tip" hidden>Turn your phone sideways to see the whole book</div>
  <div class="dock glass" id="dock" hidden><div class="dtop"><span class="stars" id="dStars"></span><span class="info" id="dInfo"></span></div><div class="dbtns" id="dBtns"></div></div>
  <nav class="pill glass" id="pill" aria-label="Lesson controls">
    <button type="button" id="bToc" aria-label="Contents"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h9"/></svg></button>
    <button type="button" id="bPrev" aria-label="Previous step"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
    <button type="button" id="bPlay" aria-label="Play lesson"><svg id="icPlay" width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3.5v13l11-6.5z"/></svg></button>
    <div class="cap" id="cap" role="status" aria-live="polite"><div class="t"><span class="n" id="capNum"></span><span id="capSay">Tap the cover to open the book.</span></div><div class="dots" id="dots"></div></div>
    <button type="button" id="bNext" aria-label="Next step"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></button>
    <button type="button" id="bLeftPg" class="pg" aria-label="Left page" title="Left page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5z" fill="currentColor" fill-opacity=".85"/><path d="M12 6.5c2-1.5 5-2 9-1.5v13c-4-.5-7 0-9 1.5z"/></svg><span>Left</span></button>
    <button type="button" id="bRightPg" class="pg" aria-label="Right page" title="Right page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5z"/><path d="M12 6.5c2-1.5 5-2 9-1.5v13c-4-.5-7 0-9 1.5z" fill="currentColor" fill-opacity=".85"/></svg><span>Right</span></button>
    <button type="button" id="bSound" aria-label="Read aloud: off"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v4h3l4 3V5L6 8z"/><path id="sndX" d="m13 8 4 4m0-4-4 4"/><path id="sndW" d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5.5a6.5 6.5 0 0 1 0 9" style="display:none"/></svg></button>
    <button type="button" id="bLamp" class="wide" aria-label="Day or night desk"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>
    <button type="button" id="bGuide" aria-label="Teacher and parent guide"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 9.5 12 5l10 4.5L12 14z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5M22 9.5V15"/></svg></button>
  </nav>
</main>

<div class="sheetwrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div></div>

<script src="brand.js"></script>

const worldGrp=new THREE.Group();scene.add(worldGrp);const worldAnim=[];let snowPts=null,bubPts=null;
(function buildWorld(){const R=wrnd(BK.grade*7919+11);
  const ok=(x,z,m)=>!(Math.abs(x)<7.4+m&&Math.abs(z)<5.4+m);
  /* ground props: a close ring that peeks in at the screen edges, and a far ring for depth */
  for(let i=0;i<46;i++){let x,z,tries=0;const near=i<26;do{const a=R()*Math.PI*2,r=near?8.2+R()*2.6:11+R()*7;x=Math.cos(a)*r*1.25;z=Math.sin(a)*r*.95;tries++;}while(!ok(x,z,near?.3:2)&&tries<20);
    const k=WD.far[Math.floor(R()*WD.far.length)];const o=PROPS[k](R);const s=(near?.9:1.25)*(.8+R()*.45);o.scale.setScalar(s);o.position.set(x,MAT_Y*0,z);o.rotation.y=R()*Math.PI*2;
    o.traverse(m=>{if(m.isMesh){m.castShadow=near;m.receiveShadow=false;}});worldGrp.add(o);if(o.userData.spin||o.userData.flame||o.userData.blink||o.userData.sway)worldAnim.push(o);}
  /* things in the air, mostly behind and to the sides so they never cover the pages */
  for(let i=0;i<16;i++){const k=WD.air[i%WD.air.length];const o=PROPS[k](R);let x,y,z;
    if(o.userData.big){x=(R()-.5)*8;y=3+R()*2;z=-13-R()*4;o.scale.setScalar(1.1);}
    else{const side=R()<.5?-1:1;x=side*(8+R()*6);y=1.2+R()*3.2;z=-9+R()*14;if(R()<.4){x=(R()-.5)*20;z=-8-R()*5;}}
    o.position.set(x,y,z);o.userData.home=o.position.clone();o.userData.ph=R()*6;o.traverse(m=>{if(m.isMesh)m.castShadow=false;});worldGrp.add(o);worldAnim.push(o);}
  if(WD.air.includes('snowfall')||WD.air.includes('bubbles')){const n=360,pos=new Float32Array(n*3);for(let i=0;i<n;i++){let x,z;do{x=(R()-.5)*34;z=(R()-.5)*26;}while(Math.abs(x)<7&&Math.abs(z)<5&&R()<.85);pos[i*3]=x;pos[i*3+1]=R()*8;pos[i*3+2]=z;}

  const txt=s.speech||s.say;const t0=Date.now();const spoke=speak(txt,()=>setTimeout(adv,Math.max(s.demo&&!s.quietDemo?2400:s.story?1400:1100,holdMs-(Date.now()-t0))));
  if(playing&&!spoke)setTimeout(adv,Math.max(holdMs,s.demo?6000:3800,txt.split(' ').length*380));
  if(s.howto&&!playing){const tk2=playTok;setTimeout(()=>{if(tk2===playTok&&SP[cur]===sp&&stepI===i&&S&&S.game.phase==='howto')setStep(stepI+1);},holdMs+2500);}
  if(s.go){playing=false;playTok++;$('#icPlay').innerHTML='<path d="M5 3.5v13l11-6.5z"/>';$('#bPlay').classList.remove('on');}}
function next(){if(busy)return;if(!bookOpen){openBook(savedAt());return;}if(stepI<SP[cur].steps.length-1)setStep(stepI+1);else if(cur<SP.length-1)goSpread(cur+1);}
function prev(){if(busy||!bookOpen)return;if(stepI>0)setStep(stepI-1);else if(cur>0)goSpread(cur-1,SP[cur-1].steps.length-1);}
async function foldDown(){if(!popGrp)return;const g=popGrp;popGrp=null;await tween(.42,k=>{g.scale.y=Math.max(.02,1-k);},easeSine);popRoot.remove(g);disposeObj(g);}
async function popUp(){const g=popGrp;if(!g)return;g.scale.y=.02;await tween(.9,k=>{g.scale.y=.02+.98*k;},easeSoftBack);}
function flip(fwd){setLeaf(fwd?0:Math.PI,fwd?1:-1);leafF.visible=leafBk.visible=true;paperSound(.45);return tween(1.35,k=>setLeaf(fwd?Math.PI*k:Math.PI*(1-k),fwd?1:-1),easeSine).then(()=>{leafF.visible=leafBk.visible=false;});}
function copyCanvas(dst,src){dst.g.setTransform(1,0,0,1,0,0);dst.g.drawImage(src.c,0,0);dst.t.needsUpdate=true;}
async function goSpread(t,stepTo,keepPlay){if(busy||t===cur||t<0||t>=SP.length)return;if(!bookOpen){openBook(t);return;}const resume=keepPlay||playing;busy=true;setPlay(false);nextTok++;mTok++;mascot.visible=false;emblemObj=null;logoObj=null;A.stopSeq();token++;$('#sheet').hidden=true;refreshDock(true);
  const fwd=t>cur,sp=SP[t];showStory(null);setMood(STRANDI[sp.strand]||0);clearFlaps();clickables=[];draggables=[];curApi={};setView('book');await foldDown();
  if(fwd)copyCanvas(flipF,rightP);else copyCanvas(flipB,leftP);
  const api=buildSpread(t);
  if(fwd){drawPage(flipB,sp,'L');drawPage(rightP,sp,'R');await flip(true);drawPage(leftP,sp,'L');}else{drawPage(flipF,sp,'R');drawPage(leftP,sp,'L');await flip(false);drawPage(rightP,sp,'R');}
  cur=t;curApi=api;popGrp.visible=true;restoreFlaps();await popUp();busy=false;try{localStorage.setItem(SKEY+'at',String(t));}catch(e){}if(resume)setPlay(true);setStep(stepTo||0);refreshDock();}
async function openBook(t){if(busy||bookOpen)return;busy=true;token++;setPlay(false);$('#sheet').hidden=true;const sp=SP[t];if(!userMuted)setSound(true);
  if(coverDeco){const d=coverDeco;coverDeco=null;tween(.35,k=>d.scale.setScalar(Math.max(.01,1-k))).then(()=>{scene.remove(d);disposeObj(d);});}
  const api=buildSpread(t);setMood(STRANDI[sp.strand]||0);drawPage(leftP,sp,'L');drawPage(rightP,sp,'R');paperSound(.5);bookOpen=true;setView('book');
  await tween(1.8,k=>{coverPivot.rotation.z=Math.PI*k;},easeSine);leftBlock.visible=leftMesh.visible=true;
  await tween(.35,k=>{const s=Math.max(.02,k);leftBlock.scale.y=s;leftBlock.position.y=MAT_Y+COVER_T+BLOCK_T*s/2;leftMesh.position.y=MAT_Y+COVER_T+BLOCK_T*s+.004;},easeOut);
  cur=t;curApi=api;popGrp.visible=true;restoreFlaps();await popUp();busy=false;try{localStorage.setItem(SKEY+'at',String(t));}catch(e){}setPlay(true);setStep(0);refreshDock();}

/* ================= picking + dragging in 3D ================= */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null,drag=null;
function setRay(e){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);}
function findDrag(e){if(!draggables.length)return null;setRay(e);const hs=ray.intersectObjects(draggables,true);for(const h of hs){let o=h.object;while(o&&!o.userData.drag)o=o.parent;if(o)return o;}return null;}
function pickAt(e){setRay(e);
  if(!bookOpen){const hs=ray.intersectObjects(coverDeco?[board,coverDeco]:[board],true);return hs.length?{fn:()=>openBook(savedAt())}:null;}
  const hs=ray.intersectObjects(clickables.concat([leftMesh,rightMesh]),true);
  for(const h of hs){let o=h.object;if(o===leftMesh||o===rightMesh){if(!h.uv)return null;const p=o.userData.page;const cx=h.uv.x*CW,cy=(1-h.uv.y)*CH;
      const hit=p.hot.slice().reverse().find(q=>cx>=q.x-10&&cx<=q.x+q.w+10&&cy>=q.y-10&&cy<=q.y+q.h+10);return hit?{fn:hit.fn}:null;}
    while(o&&!o.userData.tap)o=o.parent;if(o)return {fn:o.userData.tap};}return null;}
stage.addEventListener('pointerdown',e=>{if(busy||!bookOpen||e.target!==renderer.domElement||(e.button&&e.button>0))return;const o=findDrag(e);if(!o)return;
  e.stopPropagation();controls.enabled=false;drag={o,d:o.userData.drag,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};},true);
const dragPt=new THREE.Vector3();
window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;const {o,d}=drag;
  if(!drag.moved){drag.moved=true;movers.delete(o);o.userData.tPos=null;if(d.start)d.start(o);}
  setRay(e);const plane=d.plane||new THREE.Plane(V(0,1,0),-(PY+(d.h==null?.35:d.h)));if(ray.ray.intersectPlane(plane,dragPt)){if(d.move)d.move(dragPt.clone(),o);else o.position.copy(o.parent.worldToLocal(dragPt.clone()));}});
function endDrag(e,cancel){if(!drag||e.pointerId!==drag.id)return;const {o,d,moved}=drag;drag=null;controls.enabled=true;if(cancel)return;
  if(!moved){if(d.tap)d.tap(o);else if(o.userData.tap)o.userData.tap();}else if(d.drop)d.drop(o.position.clone(),o);}
window.addEventListener('pointerup',e=>endDrag(e,false));window.addEventListener('pointercancel',e=>endDrag(e,true));
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(d>8||busy)return;const h=pickAt(e);if(h)h.fn();});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||down||busy||drag)return;renderer.domElement.style.cursor=findDrag(e)?'grab':(pickAt(e)?'pointer':'default');});

/* ================= controls ================= */
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#bNext').onclick=next;$('#bPrev').onclick=prev;
$('#bLeftPg').onclick=()=>{if(!bookOpen){openBook(savedAt());return;}autoCam=false;setView('read');};$('#bRightPg').onclick=()=>{if(!bookOpen){openBook(savedAt());return;}autoCam=false;setView('model');};
$('#bPlay').onclick=()=>{if(!bookOpen){openBook(savedAt());return;}if(playing){setPlay(false);return;}setPlay(true);setStep(stepI);};
$('#cap').onclick=()=>{if(!bookOpen){openBook(savedAt());return;}if(cur>=0)setStep(stepI);};
let userMuted=false;
function setSound(on){soundOn=on;$('#sndX').style.display=soundOn?'none':'';$('#sndW').style.display=soundOn?'':'none';$('#bSound').classList.toggle('on',soundOn);ac();$('#bSound').setAttribute('aria-label','Read aloud: '+(soundOn?'on':'off'));if(!soundOn)stopSpeak();}
$('#bSound').onclick=()=>{setSound(!soundOn);userMuted=!soundOn;if(soundOn&&cur>=0){const s=SP[cur].steps[stepI];speak(s.speech||s.say);}else if(soundOn)speak('Tap the cover to open the book.');};

let night=false;
function applyLight(){const sky=night?moodNow.sky.clone().lerp(new THREE.Color('#0d1020'),.84):moodNow.sky;
  hemi.intensity=night?.22:(WD.dark?.78:.64);if(night)hemi.color.set(0x8090c0);else hemi.color.copy(moodNow.hm);sun.intensity=night?0:(WD.dark?.62:.78);lamp.intensity=night?1.25:0;
  if(!(scene.background&&scene.background.isColor))scene.background=new THREE.Color();scene.background.copy(sky);
  if(!scene.fog)scene.fog=new THREE.Fog(0xffffff,26,78);scene.fog.color.copy(sky);
  groundMat.color.copy(moodNow.gr);if(night)groundMat.color.multiplyScalar(.45);
  document.documentElement.style.setProperty('--bg','#'+sky.getHexString());}
$('#bLamp').onclick=()=>{night=!night;document.documentElement.setAttribute('data-theme',night?'dark':'light');$('#bLamp').classList.toggle('on',night);applyLight();};
function sheet(html){$('#sheetBody').innerHTML=html+'<div class="close"><button type="button" id="sheetClose">Close</button></div>';$('#sheet').hidden=false;$('#sheetClose').onclick=()=>{$('#sheet').hidden=true;};$('#sheetClose').focus();}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#sheet').hidden=true;return;}if(!$('#sheet').hidden)return;if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();});
function openToc(){let h='<div class="eyebrow">'+TITLE+' · '+SUB+'</div><h2>Contents</h2><div class="muted">By '+AUTHOR+'. Each lesson has a Learn spread and a Practice spread. Win the practice game to earn its stamp.</div><ol class="toclist">';
  let last='';LESSONS.forEach(L=>{if(L.strand!==last){h+='<li class="grp">'+L.strand+'</li>';last=L.strand;}const i=SP.indexOf(L.learnSp);
    h+='<li><button type="button" data-i="'+i+'"><span class="n" style="background:'+L.color+'">'+L.n+'</span><span><span class="tt">'+L.title+'</span><br><span class="st">'+L.codes.map(c=>GR+'.'+c).join(', ')+'</span></span><span class="sc'+(stamps[L.id]?' got':'')+'">'+(stamps[L.id]?'★ Stamped':'')+'</span></button></li>';});
  sheet(h+'</ol>');document.querySelectorAll('.toclist button').forEach(b=>b.onclick=()=>{$('#sheet').hidden=true;const i=+b.dataset.i;bookOpen?goSpread(i):openBook(i);});}
$('#bToc').onclick=openToc;$('#badge').onclick=openToc;
$('#bGuide').onclick=()=>{const s=bookOpen&&cur>=0?SP[cur]:SP[0];const L=s.L;
  if(!L){sheet('<div class="eyebrow">For parents and teachers</div><h2>About this book</h2><p><b>'+TITLE+': '+SUB+'</b> by '+AUTHOR+', published by '+BRANDNAME+', follows the Ontario Grade '+GR+' '+(BK.curriculum||'mathematics')+' curriculum (2020) across all five content strands: Number, Algebra, Data, Spatial Sense and Financial Literacy.</p><h3>How a lesson runs</h3><ul><li><b>Learn spread:</b> the theory, key words and a prediction flap on the left; a 3D model on the right that demonstrates the idea when you press play, and that children can touch, drag and build.</li><li><b>Practice spread:</b> three lift-the-flap questions and a five-round 3D game with fresh puzzles every time.</li></ul><p class="muted">Each lesson lists its Ontario expectation codes in the footer and in this guide. Read-aloud is on the speaker button. Progress is saved in this browser.</p>');return;}
  const g=L.guide||{};sheet('<div class="eyebrow">Lesson '+L.n+' · '+L.strand+'</div><h2>'+L.title+'</h2><div class="codes">'+L.codes.map(c=>'<span>Ontario '+GR+'.'+c+'</span>').join('')+'</div><h3>Learning goal</h3><p>'+(g.goal||'')+'</p><h3>Key vocabulary</h3><p>'+(g.words||'')+'</p><h3>Questions to ask</h3><ul>'+(g.ask||[]).map(a=>'<li>'+a+'</li>').join('')+'</ul><h3>Try at home</h3><p>'+(g.home||'')+'</p><p class="muted">'+TITLE+' by '+AUTHOR+' · '+BRANDNAME+'</p>');};

/* ================= loop ================= */
const clock=new THREE.Clock();
function frame(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);let bad=false;try{w.fn(w.ease(k));}catch(e){bad=true;console.warn('tween',e);}if(k>=1||bad){tweens.splice(i,1);w.res();}}
  if(camTween){camTween.t=Math.min(1,camTween.t+dt/1.5);const k=easeIO(camTween.t);camera.position.lerpVectors(camTween.p0,camTween.p1,k);controls.target.lerpVectors(camTween.q0,camTween.q1,k);if(camTween.t>=1)camTween=null;}
  for(const o of movers){const u=o.userData,a=1-Math.exp(-u.k*dt);let done=true;
    if(u.tPos){o.position.lerp(u.tPos,a);if(o.position.distanceToSquared(u.tPos)>1e-6)done=false;else{o.position.copy(u.tPos);u.tPos=null;}}
    if(u.tScale!=null){const s=o.scale.x+(u.tScale-o.scale.x)*a;o.scale.setScalar(s);if(Math.abs(s-u.tScale)>1e-3)done=false;else{o.scale.setScalar(u.tScale);u.tScale=null;}}
    if(u.tRotY!=null){o.rotation.y+=(u.tRotY-o.rotation.y)*a;if(Math.abs(o.rotation.y-u.tRotY)>1e-3)done=false;else{o.rotation.y=u.tRotY;u.tRotY=null;}}
    if(done){movers.delete(o);if(u.done){const f=u.done;u.done=null;try{f();}catch(e){console.warn("mover",e);}}}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i],u=p.userData;u.v.y-=9*dt;p.position.addScaledVector(u.v,dt);p.rotation.y+=6*dt;p.rotation.x+=3*dt;u.life-=dt;if(u.life<.4)p.scale.setScalar(.35*Math.max(0,u.life/.4));if(u.life<=0){scene.remove(p);parts.splice(i,1);}}
  if(coverDeco){coverDeco.userData.ring.rotation.y=t*.6;coverDeco.userData.bits.forEach(m=>{m.position.y=m.userData.y0+Math.sin(t*1.6+m.userData.ph)*.12;m.rotation.y=t*.8+m.userData.ph;});}
  try{animWorld(t,dt);}catch(e){}
  if(curApi.tick&&!busy){try{curApi.tick(dt,t);}catch(e){console.error(e);curApi.tick=null;}}
  if(emblemObj){emblemObj.rotation.y=t*.9;emblemObj.position.y=.42+Math.sin(t*2)*.05;}if(logoObj){logoObj.rotation.y=t*.8;logoObj.position.y=Math.sin(t*1.4)*.05;}
  if(autoCam&&!camTween&&basePose&&!drag&&bookOpen){autoT+=dt;const off=basePose.p.clone().sub(basePose.t);const a=Math.sin(autoT*.32)*.42,e=1+Math.sin(autoT*.21)*.06;off.applyAxisAngle(V(0,1,0),a).multiplyScalar(e);camera.position.copy(basePose.t).add(off);controls.target.copy(basePose.t);}
  controls.update();renderer.render(scene,camera);requestAnimationFrame(frame);}

function start(){LESSONS=PM.lessons;makeSpreads();applyLight();updateBadge();updateRank();drawCover(coverCanvas.getContext('2d'));coverTex.needsUpdate=true;drawEndpaper(endCanvas.getContext('2d'));endTex.needsUpdate=true;
  leftBlock.visible=leftMesh.visible=false;coverDeco=buildCoverDeco();

  setView('cover',true);camera.position.add(V(0,5,4));setView('cover');frame();$('#loading').style.opacity=0;}
