<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Alphabet Song · Pop-Up Diorama</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#07071a;font-family:'Segoe UI','Trebuchet MS',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;display:block;cursor:pointer}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(130,225,255,.06) 0 1px,transparent 1px 3px);mix-blend-mode:screen;opacity:.55;animation:scan 7s linear infinite}
@keyframes scan{from{background-position:0 0}to{background-position:0 64px}}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(4,4,16,.75) 100%)}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:2vh 4vw;color:#fff;text-align:center}
#title{font-size:clamp(1.1rem,3vw,2.2rem);font-weight:900;letter-spacing:.14em;text-shadow:0 0 22px rgba(140,220,255,.95),0 2px 6px rgba(0,0,0,.6)}
#title small{display:block;font-weight:700;font-size:.5em;letter-spacing:.28em;opacity:.85;margin-top:.35em;color:#9fe6ff}
#now{margin-bottom:1.2vh}
#letter{font-size:clamp(4.2rem,15vw,11rem);font-weight:900;line-height:.95;text-shadow:0 0 26px #7fd8f0,0 0 60px #ff8fab,0 0 90px #b97cff;transition:opacity .18s}
#word{font-size:clamp(1rem,3vw,1.8rem);font-weight:800;letter-spacing:.06em;opacity:.95;margin-top:.25em;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#hint{position:fixed;left:50%;bottom:2.8vh;transform:translateX(-50%);pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.13);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4);color:#fff;padding:.72em 1.4em;border-radius:999px;font-weight:800;font-size:clamp(.9rem,2.4vw,1.15rem);box-shadow:0 0 24px rgba(120,220,255,.55);animation:pulse 1.6s ease-in-out infinite;z-index:9}
#hint.off{display:none}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scan"></div>
<div id="vignette"></div>
<div id="hud">
  <div id="title">THE ALPHABET SONG<small>A&nbsp;·&nbsp;Z &nbsp;POP-UP DIORAMA</small></div>
  <div id="now"><div id="letter">A</div><div id="word">Apple</div></div>
</div>
<div id="hint">🔊 Tap for music</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- data ---------- */
var LETTERS=[
 ['A','Apple','🍎','#ff6b6b'],['B','Bear','🐻','#ffa94d'],['C','Cat','🐱','#ffd43b'],['D','Duck','🦆','#69db7c'],
 ['E','Elephant','🐘','#4dabf7'],['F','Fox','🦊','#ff8787'],['G','Giraffe','🦒','#ffc078'],['H','Horse','🐴','#a9e34b'],
 ['I','Ice cream','🍦','#e599f7'],['J','Octopus','🐙','#4dd4d4'],['K','Koala','🐨','#94d82d'],['L','Lion','🦁','#ffa94d'],
 ['M','Monkey','🐵','#c0a86b'],['N','Chick','🐤','#ffd43b'],['O','Owl','🦉','#b197fc'],['P','Penguin','🐧','#4dabf7'],
 ['Q','Queen','👑','#ffd43b'],['R','Rabbit','🐰','#ff8787'],['S','Star','⭐','#ffe066'],['T','Turtle','🐢','#69db7c'],
 ['U','Unicorn','🦄','#e599f7'],['V','Volcano','🌋','#ff8787'],['W','Whale','🐳','#74c0fc'],['X','Xylophone','🎵','#4dd4d4'],
 ['Y','Yo-yo','🪀','#94d82d'],['Z','Zebra','🦓','#b0b0b0']
];
var NOTE={C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,C5:523.25,D5:587.33,E5:659.25,G5:784.00};
var MEL=['C4','C4','G4','G4','A4','A4','G4','F4','F4','E4','E4','D4','D4','C4','G4','G4','F4','F4','E4','E4','D4','G4','G4','F4','F4','E4'];
var CLOSE=['C4','E4','G4','C5'];
var STEP=0.42;
var N=LETTERS.length;

/* ---------- three.js setup ---------- */
var canvas=document.getElementById('scene');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x07071a);
scene.fog=new THREE.FogExp2(0x07071a,0.05);
var camera=new THREE.PerspectiveCamera(52,window.innerWidth/window.innerHeight,0.1,120);
camera.position.set(0,2.4,10.6);
camera.lookAt(0,1.5,0);
var l1=new THREE.PointLight(0x7fd8f0,1.6,40);scene.add(l1);
var l2=new THREE.PointLight(0xff8fab,1.4,40);scene.add(l2);

/* helpers */
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();}
function makeLetterTex(L){
  var ch=L[0],word=L[1],emo=L[2],color=L[3];
  var c=document.createElement('canvas');c.width=256;c.height=320;var g=c.getContext('2d');
  roundRect(g,8,8,240,304,30);g.fillStyle=color;g.fill();
  roundRect(g,20,20,216,280,24);g.fillStyle='rgba(255,255,255,.16)';g.fill();
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#fff';g.font='900 132px "Trebuchet MS",sans-serif';g.fillText(ch,128,118);
  g.font='92px serif';g.fillText(emo,128,222);
  g.fillStyle='rgba(255,255,255,.96)';g.font='800 22px "Trebuchet MS",sans-serif';g.fillText(word,128,288);
  var t=new THREE.CanvasTexture(c);t.minFilter=t.magFilter=THREE.LinearFilter;return t;
}
function makeChibiFace(){
  var c=document.createElement('canvas');c.width=c.height=256;var g=c.getContext('2d');
  g.fillStyle='#ffe8d6';g.beginPath();g.arc(128,142,104,0,Math.PI*2);g.fill();
  g.fillStyle='#ff9ec6';g.beginPath();g.arc(128,100,104,Math.PI,Math.PI*2);g.fill();
  g.beginPath();g.arc(86,132,34,Math.PI,Math.PI*1.9);g.arc(170,132,34,Math.PI*1.1,Math.PI*2);g.fill();
  g.fillStyle='#fff';ell(g,94,152,31,37);ell(g,162,152,31,37);
  g.fillStyle='#4a6cf7';g.beginPath();g.arc(94,152,18,0,Math.PI*2);g.fill();g.beginPath();g.arc(162,152,18,0,Math.PI*2);g.fill();
  g.fillStyle='#15223b';g.beginPath();g.arc(94,152,10,0,Math.PI*2);g.fill();g.beginPath();g.arc(162,152,10,0,Math.PI*2);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(98,146,4,0,Math.PI*2);g.fill();g.beginPath();g.arc(166,146,4,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(255,120,150,.5)';g.beginPath();g.arc(66,182,16,0,Math.PI*2);g.arc(190,182,16,0,Math.PI*2);g.fill();
  g.strokeStyle='#c2576a';g.lineWidth=5;g.lineCap='round';g.beginPath();g.arc(128,188,26,.15*Math.PI,.85*Math.PI);g.stroke();
  g.strokeStyle='#ff9ec6';g.lineWidth=6;g.beginPath();g.moveTo(128,34);g.quadraticCurveTo(150,6,178,18);g.stroke();
  var t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;return t;
}
function makeGlow(color){
  var c=document.createElement('canvas');c.width=c.height=256;var g=c.getContext('2d');
  var gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.28,color);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
function makeDot(){
  var c=document.createElement('canvas');c.width=c.height=32;var g=c.getContext('2d');
  var gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(c);
}
/* floor glow ring */
var floorTex=makeGlow('rgba(120,220,255,.8)');
var floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshBasicMaterial({map:floorTex,transparent:true,blending:THREE.AdditiveBlending,opacity:.5,depthWrite:false}));
floor.rotation.x=-Math.PI/2;floor.position.y=0.02;scene.add(floor);

/* 26 arc cards (diorama backdrop) */
var glowTex=makeGlow('rgba(140,220,255,.6)');
var arc=[];
LETTERS.forEach(function(L,i){
  var t=i/(N-1);
  var ang=THREE.MathUtils.degToRad(-72+t*144);
  var x=Math.sin(ang)*5.6, z=-1.6-Math.cos(ang)*2.6;
  var mat=new THREE.MeshBasicMaterial({map:makeLetterTex(L),transparent:true,color:new THREE.Color(0.5,0.5,0.66)});
  var mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.02,1.28),mat);
  var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:L[3],transparent:true,blending:THREE.AdditiveBlending,opacity:0,depthWrite:false}));
  glow.scale.set(2.1,2.1,1);
  var grp=new THREE.Group();grp.add(mesh);grp.add(glow);
  grp.position.set(x,1.62,z);
  scene.add(grp);
  arc.push({grp:grp,mesh:mesh,glow:glow,mat:mat,color:L[3],baseY:1.62});
});

/* big center pop-up card */
var bigMat=new THREE.MeshBasicMaterial({map:makeLetterTex(LETTERS[0]),transparent:true});
var bigMesh=new THREE.Mesh(new THREE.PlaneGeometry(2.6,3.25),bigMat);
var bigGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:LETTERS[0][3],transparent:true,blending:THREE.AdditiveBlending,opacity:.85,depthWrite:false}));
bigGlow.scale.set(5.2,5.2,1);
var bigGroup=new THREE.Group();bigGroup.add(bigMesh);bigGroup.add(bigGlow);
bigGroup.position.set(0,1.7,1.0);scene.add(bigGroup);

/* chibi mascot */
var mascot=new THREE.Sprite(new THREE.SpriteMaterial({map:makeChibiFace(),transparent:true,depthWrite:false}));
mascot.scale.set(1.7,1.7,1);mascot.position.set(-2.6,0.6,2.6);scene.add(mascot);

/* floating hologram particles */
var dotTex=makeDot();
var particles=[];
for(var p=0;p<90;p++){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex,color:new THREE.Color().setHSL(Math.random(),0.7,0.7),transparent:true,blending:THREE.AdditiveBlending,opacity:Math.random()*0.7+0.2,depthWrite:false}));
  var sc=Math.random()*0.16+0.05;s.scale.set(sc,sc,1);
  s.position.set((Math.random()-0.5)*14,Math.random()*7,(Math.random()-0.5)*10);
  s.userData={vy:Math.random()*0.5+0.15,ph:Math.random()*Math.PI*2};
  scene.add(s);particles.push(s);
}

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});


/* ---------- audio (Web Audio) ---------- */
var actx=null, audioOn=false, t0=performance.now();
var nextT=0, stepIdx=0, CYCLE=N+CLOSE.length;
function ensureAudio(){
  if(!actx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; actx=new AC(); }
  if(actx.state==='suspended')actx.resume();
}
function tone(t,f,dur,type,gain){
  var o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(gain||0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.05);
}
function kick(t){
  var o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.18);
}
function hat(t){
  var b=actx.createBuffer(1,actx.sampleRate*0.05,actx.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  var s=actx.createBufferSource();s.buffer=b;var g=actx.createGain();g.gain.value=0.07;
  var f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=6000;
  s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t);
}
function noteFor(k){return k<N?MEL[k]:CLOSE[k-N];}
function bassFor(n){return n[0]==='C'?'C3':n[0]==='D'?'D3':n[0]==='E'?'E3':n[0]==='F'?'F3':n[0]==='G'?'G3':'A3';}
function schedule(){
  if(!audioOn||!actx)return;
  while(nextT<actx.currentTime+0.7){
    var k=stepIdx%26, note=noteFor(stepIdx);
    tone(nextT,NOTE[note],STEP*0.85,'triangle',0.22);
    tone(nextT,NOTE[bassFor(note)],STEP*0.7,'sine',0.15);
    kick(nextT);
    if(stepIdx%2===0)hat(nextT+STEP/2);
    stepIdx=(stepIdx+1)%CYCLE;nextT+=STEP;
  }
}
function songTime(){ return (audioOn&&actx)?actx.currentTime:(performance.now()-t0)/1000; }
function currentLetter(){ var tt=songTime()%(CYCLE*STEP); var k=Math.floor(tt/STEP); return k<N?k:-1; }

/* ---------- visuals sync ---------- */
var letterEl=document.getElementById('letter'),wordEl=document.getElementById('word');
function makeCelebTex(){
  var c=document.createElement('canvas');c.width=256;c.height=320;var g=c.getContext('2d');
  roundRect(g,8,8,240,304,30);g.fillStyle='#b97cff';g.fill();
  roundRect(g,20,20,216,280,24);g.fillStyle='rgba(255,255,255,.18)';g.fill();
  g.textAlign='center';g.textBaseline='middle';
  g.font='120px serif';g.fillText('🌟',128,150);
  g.fillStyle='#fff';g.font='900 42px "Trebuchet MS",sans-serif';g.fillText('Now I know',128,226);
  g.font='900 38px "Trebuchet MS",sans-serif';g.fillText('my ABCs!',128,272);
  var t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;return t;
}
var celebTex=makeCelebTex();
var popT=-1, curShown=-1;
function showLetter(k){
  curShown=k;
  bigMat.map=makeLetterTex(LETTERS[k]);bigMat.map.needsUpdate=true;
  bigMat.needsUpdate=true;
  bigGlow.material.color.set(LETTERS[k][3]);
  letterEl.textContent=LETTERS[k][0];
  wordEl.textContent=LETTERS[k][1];
  popT=performance.now()/1000;
  arc.forEach(function(a,i){ var on=(i===k); a.glow.material.opacity=on?0.9:0; a.mat.color.set(on?0xffffff:0x808099); a.grp.position.y=a.baseY+(on?0.25:0); });
}
function showClosing(){
  curShown=-1;
  bigMat.map=celebTex;bigMat.map.needsUpdate=true;bigMat.needsUpdate=true;
  bigGlow.material.color.set('#b97cff');
  wordEl.textContent='Now I know my ABCs!';letterEl.textContent='🌟';
  popT=performance.now()/1000;
}

/* ---------- autoplay (music needs one tap) ---------- */
var hint=document.getElementById('hint');
function startAudio(){
  ensureAudio();if(!actx)return;
  if(!audioOn){audioOn=true;nextT=actx.currentTime+0.1;stepIdx=0;t0=performance.now();}
  hint.classList.add('off');
}
hint.addEventListener('click',startAudio);
hint.addEventListener('touchend',function(e){e.preventDefault();startAudio();});
window.addEventListener('keydown',startAudio);
window.addEventListener('pointerdown',startAudio);

/* ---------- render loop ---------- */
var lastT=performance.now()/1000, camAng=0, prevCur=-2;
function easeOutBack(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function loop(){
  requestAnimationFrame(loop);
  var t=performance.now()/1000, dt=Math.min(0.05,t-lastT);lastT=t;
  if(audioOn)schedule();
  var cur=currentLetter();
  if(cur!==prevCur){ if(cur>=0)showLetter(cur); else showClosing(); prevCur=cur; }
  /* big card pop spring */
  if(popT>=0){
    var e=(t-popT)/0.5;
    if(e>=1){e=1;popT=-1;}
    var s=easeOutBack(e);
    bigGroup.scale.setScalar(s);
    bigGroup.position.y=1.7-(1-s)*0.5;
    bigGlow.material.opacity=0.85*(1-e*0.4);
  }
  /* idle: card float, mascot bounce, lights, particles, camera sway */
  camAng+=dt*0.12;
  camera.position.x=Math.sin(camAng)*1.5;camera.position.z=10.6+Math.cos(camAng)*0.3;camera.position.y=2.4+Math.sin(camAng*0.6)*0.15;
  camera.lookAt(0,1.5,0);
  l1.position.set(Math.sin(t*0.5)*5,3+Math.sin(t*0.7)*1.5,3);l1.color.setHSL((t*0.02)%1,0.8,0.6);
  l2.position.set(Math.cos(t*0.4)*5,2.5+Math.cos(t*0.6)*1.5,3);l2.color.setHSL((t*0.02+0.5)%1,0.8,0.6);
  mascot.position.y=0.6+Math.sin(t*3)*0.1;mascot.position.x=-2.6+Math.sin(t*1.2)*0.15;
  for(var i=0;i<particles.length;i++){var pt=particles[i];pt.position.y+=pt.userData.vy*dt;if(pt.position.y>7.2)pt.position.y=0;pt.position.x+=Math.sin(t+pt.userData.ph)*0.002;}
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
})();

</script>
</body>
</html>
