<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Upside-Down World</title>
<script src="../../assets/gate.js?v=5"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/cover.webp">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#3b220d;--gold:#f4c96b;--bg:#0f0a06}
html,body{height:100%;background:var(--bg);color:#f3e6cc;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'IM Fell English',Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
#wrap{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#stage{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6);background:#1a120b}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:3}
.layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.layer .kb{position:absolute;inset:0;transform-origin:72% 55%}
.layer .fb{object-fit:cover;position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.1s}
body.nogl .layer.on .fb{opacity:1}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 34% 60% at 72% 58%,rgba(0,0,0,0) 0%,rgba(10,8,20,.55) 70%,rgba(5,4,12,.72) 100%);mix-blend-mode:multiply;opacity:0;transition:opacity 3s ease}
.layer.on .shade.go{opacity:1}
/* text engraved into the parchment: pressed-in ink with a light lip under each letter */
.txt{position:absolute;display:flex;flex-direction:column;justify-content:center;text-align:left;line-height:1.36;opacity:0;transition:opacity .9s ease;overflow:hidden}
.layer.on .txt.show{opacity:1}
.txt .lip,.txt .ink{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
.txt .lip{color:rgba(255,241,212,.55);transform:translate(0,.055em);mix-blend-mode:screen;filter:blur(.35px)}
.txt .ink{color:var(--ink);mix-blend-mode:multiply;text-shadow:0 -.02em .03em rgba(60,30,8,.45);filter:blur(.15px)}
.txt .w{transition:color .3s,text-shadow .3s}
.txt .ink .w.now{color:#9a4a00;text-shadow:0 0 .35em rgba(255,200,90,.9)}
.txt.cover{text-align:center}
.txt.cover .ink,.txt.cover .lip{align-items:center}
.txt h1,#panel h1{font-family:'IM Fell English SC',serif;font-weight:400;line-height:1.05;letter-spacing:.02em}
.by{font-style:italic;margin-top:.8em;opacity:.85}
.orn{margin:.45em 0;letter-spacing:.6em;opacity:.6}
.dropcap::first-letter{font-size:2.1em;float:left;line-height:.9;padding:.04em .08em 0 0}
.ink .dropcap::first-letter{color:#6b2b04}
.rings{position:absolute;opacity:0;transition:opacity .8s}
.rings.on{opacity:1}
.rings i{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;border:2px solid rgba(255,225,150,.75);box-shadow:0 0 18px rgba(255,210,120,.6),inset 0 0 14px rgba(160,220,255,.35);animation:ring 2.6s ease-out infinite;opacity:0}
.rings i:nth-child(2){animation-delay:.65s}.rings i:nth-child(3){animation-delay:1.3s}.rings i:nth-child(4){animation-delay:1.95s}
@keyframes ring{0%{transform:scale(.15);opacity:.9}100%{transform:scale(2.6);opacity:0}}
#panel{display:none;width:100%;max-width:760px;padding:14px 16px 4px;color:var(--ink)}
#panel .pp{background:linear-gradient(#efe0bd,#e5d0a3);border-radius:12px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 30px rgba(120,80,30,.25);font-size:clamp(17px,4.6vw,21px);line-height:1.45;min-height:6.2em;transition:opacity .5s}
#panel .pp.cover{text-align:center}
#panel h1{font-size:1.6em}
#panel .w.now{color:#9a4a00;text-shadow:0 0 .4em rgba(255,190,80,.6)}
body.narrow #panel{display:block}
body.narrow .txt{display:none}
#bar{display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));width:100%;justify-content:center;flex-wrap:wrap}
#bar button{font:inherit;color:#f3e6cc;background:rgba(255,235,190,.08);border:1px solid rgba(255,220,150,.28);border-radius:999px;height:44px;min-width:44px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:16px;transition:background .2s,transform .1s}
#bar button:hover{background:rgba(255,220,150,.18)}
#bar button:active{transform:scale(.96)}
#bar button:disabled{opacity:.35;cursor:default}
#bar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#bar .pg{min-width:70px;text-align:center;font-size:15px;opacity:.8}
body.narrow #bar{gap:6px;padding-top:8px}body.narrow #bar button{padding:0 12px;font-size:15px}
#next.pulse{animation:pulse 1.6s ease-in-out infinite;border-color:var(--gold)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,201,107,0)}50%{box-shadow:0 0 0 6px rgba(244,201,107,.25)}}
#auto[aria-pressed=true]{background:rgba(244,201,107,.22);border-color:var(--gold)}
#start{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6%;z-index:5;background:linear-gradient(transparent 55%,rgba(10,6,3,.55));cursor:pointer;border:0;color:inherit;font:inherit}
#start span{font-family:'IM Fell English SC',serif;font-size:clamp(17px,2.3vw,28px);padding:.55em 1.4em;border-radius:999px;background:rgba(30,18,8,.75);border:1px solid var(--gold);color:#ffe9b8;box-shadow:0 0 30px rgba(244,201,107,.35);animation:pulse 1.8s ease-in-out infinite}
#start.gone{display:none}
#home{position:fixed;top:8px;left:10px;z-index:6;color:#f3e6cc;opacity:.7;text-decoration:none;font-size:15px;padding:8px 10px}
#home:hover{opacity:1}
</style>
</head>
<body>
<a id="home" href="../../account.html">&larr; My books</a>
<div id="wrap">
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>
    <button id="start" aria-label="Open the book"><span>Open the book</span></button>
  </div>
  <div id="panel" aria-live="polite"><div class="pp" id="pp"></div></div>
</div>
<div id="bar">
  <button id="prev" aria-label="Previous page">&#8592;</button>
  <button id="play" aria-label="Play narration">&#9654; Read</button>
  <span class="pg" id="pg">Cover</span>
  <button id="auto" aria-pressed="true" title="Turn the pages by itself">Auto turn</button>
  <button id="next" aria-label="Next page">&#8594;</button>
</div>
<script src="story.js"></script>
<script src="sprite.js?v=3"></script>
<script src="voice.js"></script>
<script src="vtime.js"></script>
<script>
(function(){
"use strict";
const S=window.STORY,P=S.pages,W=1408,H=768;
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('fx'),glc=$('gl'),pp=$('pp');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function fnv(t){let h=0x811c9dc5;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return ('0000000'+h.toString(16)).slice(-8);}
const curly=s=>s.replace(/(^|[\s(])"/g,'$1“').replace(/"/g,'”').replace(/'/g,'’');
let u=1,cur=-1,part=0,playing=false,auto=true,started=false,timer=0,raf=0,pageT0=performance.now();
const audio=new Audio();audio.preload='auto';

/* ---------- living picture: WebGL depth parallax ----------
   Each picture has a relief map (how far each pixel rises out of the book, made offline with Depth Anything V2).
   The shader drifts a slow virtual camera and the pointer, so the hologram moves in 3D while the book and desk stay put,
   adds a gentle breathing sway to the raised parts, and shimmers their light. */
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;v.y=1.-v.y;gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;varying vec2 v;
uniform sampler2D tA,dA,tB,dB;uniform float mixv,t,sA,sB,dimA,dimB;uniform vec2 par,oA,oB;
float mask(vec2 q){return smoothstep(.30,.40,q.x)*smoothstep(.97,.90,q.x)*smoothstep(.95,.85,q.y);}
vec3 live(sampler2D tx,sampler2D dx,vec2 uv,float s,vec2 o,float dim){
  vec2 q=o+(uv-o)/s;
  float m=mask(q);vec2 dir=par*.011*(.35+.65*m)+m*vec2(sin(t*.85+q.y*9.+q.x*2.),cos(t*.67+q.x*7.))*.0022;
  float rl=smoothstep(.14,1.,texture2D(dx,q).r);
  float r2=smoothstep(.14,1.,texture2D(dx,q-dir*rl).r);
  vec2 q2=q-dir*max(r2,rl*.5);
  vec3 c=texture2D(tx,q2).rgb;
  float sh=m*r2*(.055*sin(t*1.6+q.x*13.+q.y*6.)+.035*sin(t*2.7-q.y*17.));
  c*=1.+sh;c*=1.-dim*.25;
  return c;}
void main(){vec3 a=live(tA,dA,v,sA,oA,dimA);vec3 b=live(tB,dB,v,sB,oB,dimB);
  vec3 c=mix(a,b,smoothstep(0.,1.,mixv));c+=vec3(1.,.82,.5)*.10*sin(3.14159*mixv);
  gl_FragColor=vec4(c,1.);}`;
let gl=null,prog=null,U={},tex={},slotA=null,slotB=null,fadeT0=0,fading=false;
try{gl=glc.getContext('webgl',{antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:true});}catch(e){}
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
if(gl){try{prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ['tA','dA','tB','dB','mixv','t','sA','sB','dimA','dimB','par','oA','oB'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  [0,1,2,3].forEach(i=>gl.uniform1i(U[['tA','dA','tB','dB'][i]],i));}catch(e){console.warn(e);gl=null;}}
if(!gl)document.body.classList.add('nogl');
function loadTex(src){
  if(tex[src])return tex[src];
  const o={ready:false,t:null,p:null};tex[src]=o;
  o.p=new Promise(res=>{const im=new Image();im.decoding='async';im.onload=()=>{if(gl){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);o.t=t;}
    o.ready=true;res(o);};im.onerror=()=>res(o);im.src=src;});
  return o;}
/* a page with a living video: the still shows until the video can play; the video already moves, so no relief parallax */
const vids={};let blackT=null;
function black(){if(!blackT&&gl){blackT=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,blackT);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0]));}return {ready:true,t:blackT};}
function loadVid(name){if(vids[name])return vids[name];const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';v.crossOrigin='anonymous';v.src='img/'+name+'.mp4';
  const o={v,t:null,ok:false};v.addEventListener('playing',()=>{o.ok=true;});vids[name]=o;return o;}
function pageTex(p){if(p.video)return {c:loadTex('img/'+p.img+'.webp'),d:black(),vid:loadVid(p.video)};return {c:loadTex('img/'+p.img+'.webp'),d:loadTex('img/'+p.img+'-d.webp')};}
const ORIGIN={kb:[.72,.55],shade:[.80,.74]};
function kbScale(p,el){const dur=40,x=Math.min(1,el/dur),e=1-Math.pow(1-x,2);return 1+(p.fx==='shade'?.065:.045)*e;}

/* ---------- layout ---------- */
function fit(){
  const bw=window.innerWidth,bh=window.innerHeight-($('bar').offsetHeight||70);
  let w=Math.min(bw-16,bh*W/H);
  const narrow=w<820;document.body.classList.toggle('narrow',narrow);
  if(narrow){const ph=Math.min(240,bh*.45);w=Math.min(bw,Math.max(160,bh-ph)*W/H);}
  w=Math.floor(w);const h=Math.round(w*H/W);
  stage.style.width=w+'px';stage.style.height=h+'px';u=w/W;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  glc.width=Math.min(2816,Math.round(w*dpr));glc.height=Math.round(glc.width*H/W);if(gl)gl.viewport(0,0,glc.width,glc.height);
  Object.values(layers).forEach(sizeText);
}
/* ---------- pages ---------- */
const layers={};
function makeLayer(i){
  if(layers[i])return layers[i];
  const p=P[i],L=document.createElement('div');L.className='layer';
  const kb=document.createElement('div');kb.className='kb';kb.style.transformOrigin=(p.fx==='shade'?'80% 74%':'72% 55%');
  if(!gl){let im;if(p.video){im=loadVid(p.video).v;im.poster='img/'+p.img+'.webp';}else{im=new Image();im.src='img/'+p.img+'.webp';im.alt='';}im.className='fb';kb.appendChild(im);}
  if(p.fx==='shade'){const s=document.createElement('div');s.className='shade';kb.appendChild(s);L._shade=s;}
  if(p.song){const r=document.createElement('div');r.className='rings';r.style.cssText='left:'+(650/W*100)+'%;top:'+(55/H*100)+'%;width:'+(130/W*100)+'%;height:'+(130/H*100)+'%';r.innerHTML='<i></i><i></i><i></i><i></i>';kb.appendChild(r);L._rings=r;}
  const t=document.createElement('div');t.className='txt'+(p.cover?' cover':'');const b=p.box;
  t.style.cssText='left:'+(b[0]/W*100)+'%;top:'+(b[1]/H*100)+'%;width:'+((b[2]-b[0])/W*100)+'%;height:'+((b[3]-b[1])/H*100)+'%';
  kb.appendChild(t);L._t=t;L._p=p;L._kb=kb;L.appendChild(kb);stage.insertBefore(L,cv);layers[i]=L;pageTex(p);return L;
}
function words(s){return curly(s).split(' ').map(w=>'<span class="w">'+w+'</span>').join(' ');}
function coverHTML(){return '<h1>'+S.title.replace('Upside-Down','Upside&#8209;Down')+'</h1><div class="orn">&#10022; &#10022; &#10022;</div><div class="by">by '+S.author+'</div>';}
function setText(L,k){
  const p=L._p,t=L._t,html=p.cover?coverHTML():'<p class="'+(k===0?'dropcap':'')+'">'+words(p.parts[k])+'</p>';
  t.innerHTML='<div class="lip" aria-hidden="true">'+html+'</div><div class="ink">'+html+'</div>';
  if(L===layers[cur]){pp.className='pp'+(p.cover?' cover':'');pp.innerHTML=p.cover?coverHTML():words(p.parts[k]);}
  sizeText(L);
}
function sizeText(L){
  const t=L._t;if(!t||!t.firstChild)return;const ink=t.querySelector('.ink');
  let f=L._p.cover?56:25;t.style.fontSize=(f*u)+'px';
  let n=0;while((ink.scrollHeight>t.clientHeight+1||ink.scrollWidth>t.clientWidth+1)&&f>13&&n++<80){f-=.5;t.style.fontSize=(f*u)+'px';}
}
function show(i,k){
  if(i<0||i>=P.length)return;
  stopAudio();clearTimeout(timer);
  const prev=layers[cur],L=makeLayer(i);
  if(i+1<P.length)makeLayer(i+1);
  const same=prev===L;
  if(prev&&!same){prev.classList.remove('on');prev._t.classList.remove('show');if(prev._shade)prev._shade.classList.remove('go');if(prev._rings)prev._rings.classList.remove('on');}
  cur=i;part=k||0;
  if(!same){const now=performance.now();slotA=prev?{p:prev._p,t0:pageT0}:null;slotB={p:L._p,t0:now};pageT0=now;fadeT0=now;fading=!!prev;}
  L.classList.add('on');
  Object.keys(vids).forEach(n=>{const o=vids[n];if(L._p.video===n){try{o.v.currentTime=0;}catch(e){}o.v.play().catch(()=>{});}else if(!(prev&&prev._p.video===n))o.v.pause();});
  if(prev&&prev._p.video&&prev._p.video!==L._p.video)setTimeout(()=>{const o=vids[prev._p.video];if(o&&layers[cur]!==prev)o.v.pause();},1300);
  if(L._shade)setTimeout(()=>L._shade.classList.add('go'),400);
  setText(L,part);setTimeout(()=>L._t.classList.add('show'),same?50:600);
  $('pg').textContent=i===0?'Cover':i+' / '+(P.length-1);
  $('prev').disabled=i===0;$('next').disabled=i===P.length-1;$('next').classList.remove('pulse');
  fxMode(L._p);
  if(playing)timer=setTimeout(speak,same?300:1200);
}
function turnPart(L,k){L._t.classList.remove('show');pp.style.opacity=0;
  timer=setTimeout(()=>{part=k;setText(L,part);L._t.classList.add('show');pp.style.opacity=1;if(playing)timer=setTimeout(speak,450);},750);}
function nextPart(){
  const L=layers[cur];
  if(part<L._p.parts.length-1)turnPart(L,part+1);
  else if(cur<P.length-1){if(playing&&auto)timer=setTimeout(()=>show(cur+1,0),1500);else{playing=false;updPlay();$('next').classList.add('pulse');}}
  else{playing=false;updPlay();}
}
/* ---------- narration with word highlight ---------- */
function hl(){
  const L=layers[cur];if(!L)return;const ends=(window.VTIME||{})[fnv(L._p.parts[part])]||[];
  const t=audio.currentTime,live=!audio.paused&&!audio.ended;let k=0;while(k<ends.length&&ends[k]<t)k++;
  [L._t.querySelector('.ink'),pp].forEach(el=>el&&el.querySelectorAll('.w').forEach((w,j)=>w.classList.toggle('now',live&&j===k)));
  if(live)raf=requestAnimationFrame(hl);
}
function speak(){
  const L=layers[cur],s=L._p.parts[part],h=fnv(s);
  if(L._rings)L._rings.classList.toggle('on',(L._p.song||[]).indexOf(part)>=0);
  if(!(window.VOICE||{})[h]){timer=setTimeout(nextPart,Math.max(2500,s.split(' ').length*380));return;}
  audio.src='voice/'+h+'.mp3';
  audio.play().then(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(hl);}).catch(()=>{playing=false;updPlay();});
}
audio.addEventListener('ended',()=>{cancelAnimationFrame(raf);hl();const L=layers[cur];if(L&&L._rings)L._rings.classList.remove('on');if(playing)timer=setTimeout(nextPart,850);});
function stopAudio(){audio.pause();cancelAnimationFrame(raf);hl();}
function updPlay(){$('play').innerHTML=playing?'&#10074;&#10074; Pause':'&#9654; Read';$('play').setAttribute('aria-label',playing?'Pause narration':'Play narration');}
$('play').onclick=()=>{if(!started)return begin();playing=!playing;updPlay();clearTimeout(timer);
  if(playing){if(audio.src&&audio.currentTime>0&&!audio.ended)audio.play().then(()=>{raf=requestAnimationFrame(hl);}).catch(()=>{});else speak();}else stopAudio();};
$('auto').onclick=()=>{auto=!auto;$('auto').setAttribute('aria-pressed',auto);};
function go(d){
  if(!started){begin();return;}
  const L=layers[cur];
  if(L&&d>0&&part<L._p.parts.length-1){stopAudio();clearTimeout(timer);turnPart(L,part+1);return;}
  if(L&&d<0&&part>0){stopAudio();clearTimeout(timer);turnPart(L,part-1);return;}
  show(cur+d,0);
}
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key===' '){e.preventDefault();$('play').click();}});
let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)go(dx<0?1:-1);},{passive:true});
function begin(){started=true;$('start').classList.add('gone');playing=true;updPlay();speak();}
$('start').onclick=begin;
/* pointer and device tilt steer the 3D look */
let ptr=[0,0],ptrS=[0,0];
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();ptr=[((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2];});
stage.addEventListener('pointerleave',()=>{ptr=[0,0];});
window.addEventListener('deviceorientation',e=>{if(e.gamma==null)return;ptr=[Math.max(-1,Math.min(1,e.gamma/25)),Math.max(-1,Math.min(1,(e.beta-45)/25))];});
/* ---------- a flying object over a still page (the ball on page 1): a cut-out sprite on a tracked path, with a live golden trail ---------- */
const SPR={};let curPar=[0,0],curS=1,sprA=0,sprName=null,hist=[],sparks=[];
function loadSpr(n){if(SPR[n])return SPR[n];const d=(window.SPRITES||{})[n];if(!d)return null;const im=new Image();im.src=d.img;return SPR[n]=Object.assign({im},d);}
const CY={rest:1.6,fly:2.4,hold:.6};
function sprState(d,tt){
  if(d.kind==='kick'){

    else if(tt<R0+K+I){x=hh[0];y=hh[1];r=hh[2]*(1-.12*Math.sin(Math.PI*(tt-R0-K)/I));ang=4.2;hit=tt-R0-K;}
    else if(tt<R0+K+I+B){u=(tt-R0-K-I)/B;const p=1-Math.pow(1-u,2),lift=Math.abs(Math.sin(2.5*Math.PI*u))*Math.pow(1-u,1.3)*70;
      x=ex(hh[0],f[0],p);y=ex(hh[1],f[1],p)-lift;r=ex(hh[2],f[2],p)*(1+.35*lift/70);ang=4.2-p*5.5;mv=u<.45;hit=tt-R0-K;}

  if(tt<CY.rest){f=0;}
  else if(tt<CY.rest+CY.fly){u=(tt-CY.rest)/CY.fly;u=u*u*(3-2*u);f=u*(N-1);mv=true;}
  else if(tt<CY.rest+CY.fly+CY.hold){f=N-1;}
  else{u=1-(tt-CY.rest-CY.fly-CY.hold)/CY.fly;u=u*u*(3-2*u);f=u*(N-1);mv=true;}

function drawSprite(c,now,dt,w,h,t){
  const L=layers[cur],name=L&&L._p.sprite;if(name)sprName=name;
  sprA+=((name?1:0)-sprA)*Math.min(1,dt*4);if(sprA<.01||!sprName)return;
  const d=loadSpr(sprName);if(!d||!d.im.complete||!d.im.naturalWidth)return;
  const o=ORIGIN.kb,pm=(x,y)=>[(o[0]+(x/W-o[0])*curS+curPar[0]*.0095)*w,(o[1]+(y/H-o[1])*curS+curPar[1]*.0095)*h],ps=curS*w/W;
  const st=sprState(d,reduce?0:(now-pageT0)/1000);
  if(!reduce&&st.mv){hist.push({x:st.x,y:st.y,r:st.r,t:now});for(let j=0;j<3;j++){const a=Math.random()*6.28,q=st.r*(.3+Math.random()*.8);
      sparks.push({x:st.x+Math.cos(a)*q,y:st.y+Math.sin(a)*q,vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50-8,life:0,max:.5+Math.random()*.9,s:.8+Math.random()*1.8});}}

  for(let j=1;j<hist.length;j++){const a=hist[j-1],b=hist[j],g=1-(now-b.t)/keep,dd=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(dd/(b.r*.35)));
    for(let q=0;q<n;q++){const f=(q+1)/n,P2=pm(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f),R=(a.r+(b.r-a.r)*f)*ps*(.5+.6*g),gr=c.createRadialGradient(P2[0],P2[1],0,P2[0],P2[1],R);
      gr.addColorStop(0,'rgba(255,240,196,'+(.14*g)+')');gr.addColorStop(.45,'rgba(255,198,100,'+(.08*g)+')');gr.addColorStop(1,'rgba(255,170,70,0)');c.fillStyle=gr;c.fillRect(P2[0]-R,P2[1]-R,R*2,R*2);}}
  for(let j=sparks.length-1;j>=0;j--){const s=sparks[j];s.life+=dt;if(s.life>s.max){sparks.splice(j,1);continue;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;const P2=pm(s.x,s.y),f=Math.sin(Math.PI*s.life/s.max),R=s.s*ps*3.2+1.5;
    const g=c.createRadialGradient(P2[0],P2[1],0,P2[0],P2[1],R);g.addColorStop(0,'rgba(255,230,150,'+(.9*f)+')');g.addColorStop(1,'rgba(255,200,100,0)');c.fillStyle=g;c.fillRect(P2[0]-R,P2[1]-R,R*2,R*2);}
  if(st.hit!=null){if(!d._b){d._b=true;for(let j=0;j<22;j++){const a=Math.random()*6.28,v=40+Math.random()*130;sparks.push({x:d.hit[0],y:d.hit[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v-10,life:0,max:.5+Math.random()*.8,s:.9+Math.random()*1.9});}}
    const ag=st.hit,fa=Math.max(0,1-ag/.7),H2=pm(d.hit[0],d.hit[1]),rr=(10+ag*150)*ps;
    c.lineWidth=Math.max(1,3.2*ps*fa);c.strokeStyle='rgba(255,226,150,'+(.8*fa)+')';c.beginPath();c.arc(H2[0],H2[1],rr,0,6.283);c.stroke();
    const gs=c.createRadialGradient(H2[0],H2[1],0,H2[0],H2[1],rr*.9+8*ps);gs.addColorStop(0,'rgba(255,248,214,'+(.7*fa*fa)+')');gs.addColorStop(1,'rgba(255,200,100,0)');c.fillStyle=gs;c.fillRect(H2[0]-rr-10,H2[1]-rr-10,rr*2+20,rr*2+20);
    c.lineWidth=Math.max(1,2*ps*fa);c.strokeStyle='rgba(255,240,190,'+(.7*fa)+')';
    for(let j=0;j<8;j++){const a=j*Math.PI/4+.3,r1=rr*.45,r2=rr*(.75+.35*(j%2));c.beginPath();c.moveTo(H2[0]+Math.cos(a)*r1,H2[1]+Math.sin(a)*r1);c.lineTo(H2[0]+Math.cos(a)*r2,H2[1]+Math.sin(a)*r2);c.stroke();}}
  else d._b=false;
  const B=pm(st.x,st.y),R=st.r*ps,gl2=c.createRadialGradient(B[0],B[1],R*.6,B[0],B[1],R*2.1);
  gl2.addColorStop(0,'rgba(255,200,110,'+(st.rest?.10:.26)+')');gl2.addColorStop(1,'rgba(255,200,110,0)');c.fillStyle=gl2;c.fillRect(B[0]-R*2.2,B[1]-R*2.2,R*4.4,R*4.4);
  c.globalCompositeOperation='source-over';c.translate(B[0],B[1]);c.rotate(st.ang);const sz=d.size/d.rs*R;c.drawImage(d.im,-sz/2,-sz/2,sz,sz);
  c.restore();}
/* ---------- golden motes ---------- */
let mode={dim:0,blue:0};const motes=[];
function fxMode(p){mode={dim:p.fx==='shade'?1:0,blue:/^(p07|cover|p09)$/.test(p.img)?1:0};}
function spawn(init){const w=cv.clientWidth,h=cv.clientHeight,right=Math.random()<.8;
  return {x:(right?(.5+Math.random()*.42):(.18+Math.random()*.34))*w,y:init?Math.random()*h:h*(.5+Math.random()*.5),
  r:(.5+Math.random()*1.7)*Math.max(.55,u*1.25),vy:-(6+Math.random()*16)*Math.max(.5,u)*1.3,vx:(Math.random()-.5)*6*u,life:0,max:5+Math.random()*7,ph:Math.random()*6.28};}
let last=performance.now(),dimS=0;
function bindPage(slot,unitC,unitD){const tx=pageTex(slot.p);gl.activeTexture(gl.TEXTURE0+unitC);
  const vo=tx.vid;if(vo&&vo.ok&&vo.v.readyState>=2){if(!vo.t){vo.t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,vo.t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);}
    gl.bindTexture(gl.TEXTURE_2D,vo.t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,vo.v);}else gl.bindTexture(gl.TEXTURE_2D,tx.c.t);gl.activeTexture(gl.TEXTURE0+unitD);gl.bindTexture(gl.TEXTURE_2D,tx.d.t);return tx.c.ready&&tx.d.ready;}
function drawGL(now){
  if(!gl||!slotB)return;
  const tB=pageTex(slotB.p);if(!(tB.c.ready&&tB.d.ready)){if(!slotA)return;}
  const t=reduce?0:now/1000;
  ptrS[0]+=(ptr[0]-ptrS[0])*.04;ptrS[1]+=(ptr[1]-ptrS[1])*.04;
  const par=reduce?[0,0]:[Math.sin(t*.23)*.9+ptrS[0]*1.1,Math.cos(t*.17)*.55+ptrS[1]*.7];

  const sa=reduce?1:kbScale(A.p,(now-A.t0)/1000),sb=reduce?1:kbScale(slotB.p,(now-pageT0)/1000);

  gl.uniform2f(U.oA,oa[0],oa[1]);gl.uniform2f(U.oB,ob[0],ob[1]);gl.uniform2f(U.par,par[0],par[1]);
  dimS+=((slotB.p.fx==='shade'?1:0)-dimS)*.01;gl.uniform1f(U.dimA,A.p.fx==='shade'?dimS:0);gl.uniform1f(U.dimB,slotB.p.fx==='shade'?dimS:0);
  curPar=par;curS=sb;
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  const L=layers[cur];if(L&&L._kb)L._kb.style.transform='scale('+sb+')';
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  drawGL(now);
  const c=cv.getContext('2d'),w=cv.clientWidth,h=cv.clientHeight;c.clearRect(0,0,w,h);
  if(!reduce){
    c.globalCompositeOperation='lighter';const a0=mode.dim?.3:1;
    for(let i=0;i<motes.length;i++){const m=motes[i];m.life+=dt;m.x+=(m.vx+Math.sin(m.life*1.3+m.ph)*4*u)*dt;m.y+=m.vy*dt;
      if(m.life>m.max||m.y<-10){motes[i]=spawn(false);continue;}
