<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Upside-Down World</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#3b2a20;--paper:rgba(255,255,255,.86);--accent:#e05a7a}
html,body{height:100%}
body{font-family:'Segoe UI','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:#0d0a14;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;opacity:.5;transition:opacity .6s ease}
.scene .el{position:absolute;display:block;will-change:transform}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes swim{0%{transform:translate(0,0) rotate(-4deg)}25%{transform:translate(46px,-16px) rotate(3deg)}50%{transform:translate(90px,0) rotate(-3deg)}75%{transform:translate(46px,16px) rotate(3deg)}100%{transform:translate(0,0) rotate(-4deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-80px) scaleY(1.05)}60%{transform:translateY(0) scaleY(.92)}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.1)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-92vh);opacity:0}}
@keyframes ripple{0%{transform:scale(.15);opacity:.85}100%{transform:scale(2.8);opacity:0}}
@keyframes shimmer{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes fall{0%{transform:translateY(-12vh) rotate(0)}100%{transform:translateY(112vh) rotate(360deg)}}
@keyframes wink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.15)}}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);pointer-events:none}
#topbar .book-title{font-weight:800;letter-spacing:.05em;font-size:.95rem}
#topbar .page-num{font-size:.85rem;font-weight:600}
#page{flex:1;display:flex;align-items:center;justify-content:center;padding:64px 18px 92px;overflow-y:auto}
.card{position:relative;z-index:2;width:100%;max-width:840px;background:var(--paper);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-radius:26px;box-shadow:0 22px 60px rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.65);padding:32px 38px;animation:cardin .5s ease}
@keyframes cardin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.chapter{font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-size:.8rem;margin-bottom:10px}
.text{font-size:1.24rem;line-height:1.78}
.text p{margin-bottom:14px}
.text p:last-child{margin-bottom:0}
.text em{font-style:italic}
#nav{position:absolute;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;gap:18px;padding:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);padding:12px 22px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .12s ease,background .12s}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default;transform:none}
#dots{color:#fff;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.5);letter-spacing:.08em;min-width:110px;text-align:center}
.cover{max-width:760px;text-align:center;padding:48px 40px}
.cover h1{font-size:3rem;line-height:1.08;margin-bottom:14px;color:#6a3fb5;font-weight:900;letter-spacing:.01em}
.cover h1 .sub{display:block;font-size:1.05rem;font-weight:700;color:#e05a7a;letter-spacing:.14em;text-transform:uppercase;margin-top:14px}
.cover .byline{font-size:1.12rem;color:#5a4a3a;margin:18px auto 28px;max-width:520px;line-height:1.6}
.cover button{font-size:1.05rem;background:linear-gradient(135deg,#7c4dff,#e05a7a);color:#fff}
.end h1{font-size:3rem;color:#6a3fb5}
@media (max-width:600px){.text{font-size:1.08rem}.cover h1{font-size:2.2rem}.card{padding:22px 20px}}
</style>
</head>

const CH1_6=[
{title:"The Spooky Tree", pages:[
{s:"sunny-park", t:[`Leo kicked the bright red soccer ball hard, sending it soaring through the warm summer air. "I'm the best striker in the whole world!" he yelled, striking a pose with one foot on a mossy rock.`]},
{s:"goalie", t:[`His little brother Sam giggled, his blond hair flopping into his eyes. "No way! I'm the best goalie! You can't get it past me!" He puffed out his six-year-old chest, standing guard in front of two backpacks they'd set up as a goal.`]},
{s:"oak-tree", t:[`The ball arced high, too high. It sailed past Sam's reach and bounced once, twice, then disappeared into the dark space between the gnarled roots of a huge, ancient oak tree at the edge of the park.`,`"Oops," Leo said, his shoulders slumping.`]},
{s:"spooky-tree", t:[`Sam crept toward the tree. "Leo," he whispered, his eyes wide. "That tree looks... spooky."`,`Leo was nine. He wasn't supposed to be scared of trees. "Don't be silly, Sam. It's just a tree." But he felt it too. A shiver ran down his spine, even under the warm sun. The tree was extra shady. The branches looked like long, scratchy fingers, and the hole their ball had fallen into was black and deep, like a secret the ground was keeping.`]},
]},
{title:"The Glowing Tunnel", pages:[
{s:"under-tree", t:[`Together, they peered into the darkness. "I'll get it," Leo said, trying to sound brave. He got on his hands and knees and crawled under a low-hanging branch. The air suddenly felt cool and smelled like damp earth and something sweet, like honey. Sam crawled in right behind him, clutching the back of Leo's shirt.`]},
{s:"tunnel", t:[`Inside, it wasn't dark anymore. The space between the roots opened up into a tunnel, but it wasn't made of dirt. The walls shimmered, like they were woven from light. A soft, golden glow pulsed from the other end.`,`"Whoa," Sam breathed.`,`"Come on," Leo said, his fear turning into a fizz of excitement. "Let's see."`]},
]},
{title:"The Upside-Down World", pages:[
{s:"upside-down", t:[`They walked through the glowing tunnel, their sneakers making no sound on the smooth, warm floor. At the other end, they stepped out and both of them gasped.`,`The world was flipped upside down.`]},
{s:"blue-sun-sea", t:[`The sun, hanging in a perfectly clear sky, was the deep, sparkling blue of the ocean. And the ocean below, lapping at a shore of soft, pink sand, was a bright, sunny yellow.`,`"What... what is this place?" Sam stammered.`]},
{s:"flying-fish", t:[`But the real shock was what was flying through the blue-sun sky. Fish. Not just little fish, but huge shimmering ones with rainbow fins, flapping their tails as they soared through the air like birds. And leading them, so big it blocked out the blue sun for a moment as it passed, was a giant whale. Its tail wasn't just one color, but a swirl of every color imaginable, like a painter's swirl of all the paints in the world.`,`Sam's jaw dropped open. "Leo... the fish are flying!"`]},
{s:"whale-song", t:[`Leo just stared, speechless. He pinched his arm. It hurt. This was real.`,`Suddenly, the great whale flipped, its multicolored tail sending ripples through the air. It opened its giant mouth and a sound came out, not a roar, but a deep, melodic song that sounded like bells and waves all mixed together.`]},
{s:"tunnel-back", t:[`That was it. That was too much. Leo grabbed Sam's hand. "We have to go. Now!"`,`"But the whale!" Sam cried, trying to pull back.`,`"NOW, Sam!" Leo yanked him toward the glowing tunnel they had come from. The magic of the place was suddenly scary, too big and too strange. They scrambled back through the tunnel, stumbling over each other, and burst out from under the oak tree, landing in a heap on the familiar grass of the park.`]},
]},
{title:"Not Our Ball", pages:[
{s:"back-park", t:[`The sun was normal yellow again. The air was warm and smelled like cut grass. They were back.`,`Leo panted, his heart thumping like a drum. Sam sat up, blinking in the bright light.`,`"Where's our ball?" Sam asked, looking around.`]},
{s:"basketball", t:[`Leo spotted it sitting by the tree's trunk. He walked over to pick it up... and stopped. It wasn't their soccer ball anymore. It was a basketball. Orange and bumpy, with the familiar black lines.`,`Sam came up beside him. "That's... not our ball."`,`Leo looked from the basketball in his hand to the dark hole under the tree. He started to laugh. It was a nervous, shaky laugh. Sam stared at the ball, then at Leo, and then he started giggling too. Soon, they were both laughing so hard they could barely stand, a mix of amazement, fear, and pure confusion bubbling out of them.`]},
]},
{title:"A Lucky Trade", pages:[
{s:"walk-home", t:[`The walk home was quiet. Every crunch of their sneakers on the pavement sounded too loud. The basketball felt heavy and strange in Leo's hands.`,`Their dog, Buster, a scruffy terrier mix, barked and wagged his tail as they opened the front door. "We're home!" their mom called from the kitchen.`]},
{s:"dinner", t:[`Dinner was spaghetti and meatballs. Sam swirled his noodles, keeping his head down. Leo kicked him gently under the table.`,`"So, how was the park, boys?" their dad asked, twirling pasta onto his fork.`,`"It was good," Leo said quickly. "We lost the soccer ball, but... we found this basketball!" He held it up with a forced smile.`,`"Wow, what a lucky trade!" their mom said.`]},
{s:"secret", t:[`Sam's eyes went wide. He looked like he was about to say something about the tree and the upside-down world. Leo gave him another sharper kick under the table.`,`"Ouch!" Sam yelped.`,`"Sam, don't kick your brother," their mom said, not looking up from her plate.`,`"Sorry," Sam mumbled, rubbing his shin. He shot a look at Leo, who shook his head almost invisibly. *Don't. Say. A. Word.*`]},
]},
{title:"Evidence", pages:[
{s:"gray-day", t:[`The next day, the walk home from school felt longer than usual. The world seemed gray and boring after what they had seen. Sam kicked at a loose pebble on the sidewalk.`,`"Leo?" he said, looking up at his big brother with pleading eyes. "Leo, can we go back?"`,`Leo's stomach did a flip-flop. "Go back? To the spooky tree? Sam, that was... that was crazy! We can't."`]},
{s:"camera-plan", t:[`"But the flying fish!" Sam insisted, his hands flying up to show how they soared. "And the giant rainbow whale! Don't you want to see them again? Don't you want to have an adventure?"`,`Leo hesitated. A tiny part of him, the part that had stared in wonder at the flying whale, did want to go back. The bigger part was still scared.`,`"We could take evidence," Sam whispered, as if it was a top-secret plan. "We could take my camera! We could film it, and then we'd have proof!"`,`That was it. Proof. If they had proof, it wouldn't just be a scary, crazy dream. It would be a real, amazing discovery. "Okay," Leo heard himself say. "Okay. We'll go. But we bring the camera, and we leave the second things get weird."`]},
]},
];
const CH7_11=[
{title:"The Second Visit", pages:[
{s:"oak-tree2", t:[`Back at the park, the old oak tree looked the same. Spooky and quiet. This time, Leo carried Sam's little blue camera. They took a deep breath together and crawled under the branch.`,`The glowing tunnel was just as they remembered. They walked through, the camera held tight in Leo's hand. When they stepped out the other side, they both gasped.`,`Everything was different.`]},
{s:"busy-world", t:[`The blue sun was still there, and the yellow sea, but the world was... busy. Little creatures that looked like hamsters with wings were zipping around, carrying tiny buckets of water. And down on the yellow sand, people were walking.`,`Only they weren't normal people.`,`Some had the faces of lions, with furry manes and whiskers. Others had long, floppy bunny ears and twitching noses. A woman with sleek, black cat eyes and pointed ears waved at them as she passed, her tail swishing behind her.`,`"Whoa," Sam whispered, fumbling for the camera. "They're... animal-people!"`]},
{s:"gold-pyramid", t:[`"Stay behind me," Leo commanded, starting the camera. He filmed a group of lion-faced men building a pyramid out of gleaming gold blocks that seemed to float into place on their own. Then he pointed the camera at the sky, where small, silver ships with blinking lights were zipping between the flying fish.`,`"Aliens, too!" Sam squeaked with delight.`]},
{s:"wolf-guards", t:[`Just then, two tall men with the heads of wolves, wearing shining silver armor, spotted them. They started walking toward them, their tails stiff.`,`"Oh no," Leo breathed. The men stopped in front of them, their yellow eyes serious.`,`"What are you doing here?" one wolf-man growled. "You are not from this world. You have no face-fur."`,`Sam hid behind Leo's legs. "We're... we're lost," Leo stammered.`]},
]},
{title:"The Pearl Ship", pages:[
{s:"pearl-ship", t:[`The other wolf-man spoke into a small device on his wrist. "We found them. Two small ones, with pink, furless faces. At the shore."`,`Before they could say anything else, a strange floating vehicle, shaped like a giant pearl, drifted over to them. The door slid open. "Come with us," the wolf-man said. It wasn't a request.`,`Scared, Leo and Sam climbed inside. The pearl-ship floated silently over the yellow sea and towards a city made of crystal that shimmered in the blue sunlight. It landed gently in front of a massive palace.`]},
{s:"throne-room", t:[`The wolf-men led them down long, sparkling halls. At the end was a huge throne room. On two giant thrones sat a King and a Queen.`,`The Queen was a beautiful woman with the soft, gentle face of a deer. She wore a crown of woven silver branches.`,`The King was... not from Earth.`]},
]},
{title:"The King's Decree", pages:[
{s:"king", t:[`He was tall and slender, with skin that shimmered like a pearl. He had two enormous, kind eyes that swirled with all the colors of the rainbow, and no nose or mouth that Leo could see. He communicated with a series of soft, chiming sounds that filled the room. A lion-faced man standing nearby translated.`,`"The Great King asks where you came from," the lion-man announced.`,`Leo, with trembling legs, stepped forward. He explained about the park, the tree, and their soccer ball that had become a basketball. He even showed them the camera, playing back the video of the flying whale.`]},
{s:"decree", t:[`The King swirled with colors, and the chiming sounds grew louder. The lion-man translated again. "The King says this 'tree' is a danger. It is a rip between worlds. He will order it to be removed at once. As for you," the lion-man looked at them, "you will stay here. Your adventure is not over."`,`Sam's face lit up with excitement, but Leo's heart sank. Stay here? Forever? "But our mom and dad!" he cried out.`,`"See?" he whispered angrily to Sam. "I told you we shouldn't have come back to the upside world!"`]},
]},
{title:"Princess Xylia", pages:[
{s:"princess", t:[`Just then, a giggle came from behind one of the giant thrones. A girl stepped out. She looked like the King, with shimmery skin and rainbow-colored eyes, but she also had long, flowing hair and a bright, cheerful smile.`,`She couldn't have been much older than Leo. "Father, can't they stay a little while?" she said, her voice sounding like tiny bells. "I've never met a real furless-face before! I want to have an adventure with them!"`,`Before the King could reply, the alien princess grabbed Leo's hand and Sam's. "Come on!" she whispered, her eyes twinkling. "Let's go have some real fun! I know a place where the jellyfish sing!"`,`She pulled them toward a hidden passage in the wall, leaving the shocked King, Queen, and guards behind.`]},
{s:"xylia", t:[`"My name is Xylia," she said as they snuck down a hallway lit by glowing moss. "And I've been waiting for an adventure my whole life!"`,`Leo was still trying to process everything. Stay here? An alien princess? Singing jellyfish? He pulled back a little. "Wait, we can't just... our parents will worry!"`,`Xylia giggled, a sound like wind chimes. "Worries are for grown-ups! Adventures are for kids! And you," she said, pointing at Sam, "look like you're ready for a big one."`,`Sam, who had been scared just a moment ago, was now beaming. He forgot all about their parents and the spooky tree. "A giant adventure! Are there singing jellyfish really? Do they know any songs I know?"`]},
{s:"garden", t:[`"Probably not your songs," Xylia said, leading them through a doorway that looked like a waterfall made of liquid light. They stepped through it, sputtering and giggling, into a garden. The flowers weren't like flowers on Earth. Some had petals of crystal that chimed when the wind blew. Others glowed with a soft, pulsing light, like tiny hearts.`,`"My father is very serious about keeping the worlds separate," Xylia explained, hopping over a stream of what looked like sparkling soda pop. "He thinks it's too dangerous. But I think it's too boring! I read about your world in the star-scrolls. You have 'ice cream' and 'video games'! It sounds amazing!"`]},
{s:"pizza", t:[`"We have pizza, too!" Sam added proudly.`,`"Pizza!" Xylia's rainbow eyes went wide. "I've always wanted to try pizza!"`,`Leo, despite himself, was starting to feel a little less scared and a little more... excited. This girl wasn't scary. She was like him and Sam, just from a different, weirder place. "Okay," he said slowly. "Okay. But we have to be careful. And we have to figure out how to get home."`,`"We will!" Xylia promised, grabbing Sam's hand to help him cross the soda stream. "But first, the jellyfish concert!"`]},
]},
{title:"The Jellyfish Concert", pages:[
{s:"jellyfish", t:[`She led them to the edge of the yellow sea. There, floating just above the water, were giant, translucent jellyfish. They glowed from within, shifting from pink to green to blue. As they pulsed, a beautiful, humming melody filled the air. It was the whale's song, but softer, a chorus of gentle, glowing notes.`,`Sam sat down in the pink sand, completely mesmerized. "It's even better than my music box," he whispered.`]},
{s:"proof", t:[`Leo took out the camera. "I have to film this." He pressed record, capturing the impossible sight for proof. For a second, he almost forgot they were trapped in another world.`]},
]},

const BOOK=[...CH1_6, ...CH7_11];
const PAGES=[{cover:true}];
let cn=0;
BOOK.forEach(function(ch){cn++;ch.pages.forEach(function(p){PAGES.push({chapter:ch.title,num:cn,s:p.s,t:p.t});});});
PAGES.push({end:true});

let i=0;
const stage=document.getElementById('stage');
const page=document.getElementById('page');
const pageNum=document.getElementById('pageNum');
const dots=document.getElementById('dots');
const prev=document.getElementById('prev');
const next=document.getElementById('next');

function sceneHTML(key){
  const s=SCENES[key]||SCENES['sunny-park'];
  const els=(s.els||[]).map(function(e){
    const sym=e[0],cls=e[1],pos=e[2],size=e[3],dur=e[4],color=e[5];
    const wh=size.split('x');
    return '<svg class="el '+cls+'" style="left:'+pos[0]+';top:'+pos[1]+';width:'+wh[0]+'px;height:'+wh[1]+'px;color:'+color+';animation-duration:'+dur+'s"><use href="#'+sym+'"/></svg>';
  }).join('');
  return '<div class="scene" style="background:'+s.bg+'">'+els+'</div>';
}
function italics(t){return t.replace(/\*(.*?)\*/g,'<em>$1</em>');}

function render(){
  const p=PAGES[i];
  let bgKey, card;
  if(p.cover){
    bgKey='upside-down';
    card='<div class="card cover"><h1>The Upside-Down World<span class="sub">A story of Leo &amp; Sam</span></h1><div class="byline">A magical tree, flying fish, and the strangest game of soccer ever.</div><button id="start">Start Reading</button></div>';
  }else if(p.end){
    bgKey='jellyfish';
    card='<div class="card cover end"><h1>The End</h1><div class="byline">...but was it really over?</div><button id="again">Read Again</button></div>';
  }else{
    bgKey=p.s;
    const paras=p.t.map(function(t){return '<p>'+italics(t)+'</p>';}).join('');
    card='<div class="card"><div class="chapter">Chapter '+p.num+' &mdash; '+p.chapter+'</div><div class="text">'+paras+'</div></div>';
  }
  stage.innerHTML=sceneHTML(bgKey);
  page.innerHTML=card;
  pageNum.textContent = (p.cover||p.end) ? '' : ('Chapter '+p.num+' of '+BOOK.length);
  dots.textContent = (p.cover||p.end) ? '' : ('Page '+(i)+' of '+(PAGES.length-2));
  prev.disabled = (i===0);
  next.disabled = (i===PAGES.length-1);
  const st=document.getElementById('start'); if(st) st.onclick=function(){go(1);};
  const ag=document.getElementById('again'); if(ag) ag.onclick=function(){go(0);};
}
function go(n){
  i=Math.max(0,Math.min(PAGES.length-1,n));
  render();
  const pg=document.getElementById('page'); if(pg) pg.scrollTop=0;
}
prev.onclick=function(){go(i-1);};
next.onclick=function(){go(i+1);};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
let x0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(dx<-50)go(i+1);else if(dx>50)go(i-1);x0=null;},{passive:true});
render();
</script>
