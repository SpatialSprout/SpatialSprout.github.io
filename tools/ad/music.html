<!doctype html><meta charset="utf-8"><title>music</title>
<script src="../bookkit/tone.js"></script>
<script>
window.render = async function () {
  const buf = await Tone.Offline(({ transport }) => {
    const rev = new Tone.Reverb({ decay: 2.2, wet: 0.25 }).toDestination();
    const mar = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 3.01, modulationIndex: 10, envelope: { attack: 0.002, decay: 0.5, sustain: 0, release: 0.4 }, modulation: { type: "sine" }, modulationEnvelope: { attack: 0.002, decay: 0.2, sustain: 0, release: 0.2 } }).connect(rev); mar.volume.value = -14;
    const bass = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.3, release: 0.3 } }).connect(rev); bass.volume.value = -16;
    const kick = new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 4, envelope: { attack: 0.001, decay: 0.25, sustain: 0 } }).toDestination(); kick.volume.value = -20;
    const hat = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.04, sustain: 0 } }).toDestination(); hat.volume.value = -34;
    const bpm = 112, b = 60 / bpm;
    const chords = [["C4", "E4", "G4"], ["A3", "C4", "E4"], ["F3", "A3", "C4"], ["G3", "B3", "D4"]];
    const roots = ["C2", "A1", "F1", "G1"];
    const mel = ["E5", "G5", "A5", "G5", "E5", "D5", "C5", "D5", "E5", "G5", "C6", "B5", "A5", "G5", "E5", "G5"];
    const total = 16;
    for (let i = 0; i * b < total - 0.5; i++) {
      const t = i * b, bar = Math.floor(i / 4) % 4;
      if (i % 4 === 0) { bass.triggerAttackRelease(roots[bar], b * 2, t); }
      if (i % 2 === 0) kick.triggerAttackRelease("C1", 0.1, t);
      hat.triggerAttackRelease(0.03, t + b / 2);
      mar.triggerAttackRelease(chords[bar], 0.2, t + b / 2, 0.35);
      if (t > 3.2) mar.triggerAttackRelease(mel[i % mel.length], 0.25, t, 0.6);
    }
    mar.triggerAttackRelease(["C5", "E5", "G5", "C6"], 1.5, total - 1.8, 0.7);
  }, 17, 2, 44100);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const n = L.length, out = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) { out[i * 2] = Math.max(-1, Math.min(1, L[i])) * 32767; out[i * 2 + 1] = Math.max(-1, Math.min(1, R[i])) * 32767; }
  let s = ""; const u8 = new Uint8Array(out.buffer); for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return btoa(s);
};
</script>
