<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpatialSprout 3D ad</title>
<style>
@font-face { font-family: "Fredoka"; src: url("Fredoka[wdth,wght].ttf"); font-weight: 300 700; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #f8f5ec; font-family: "Fredoka", sans-serif; }
#bg { position: absolute; inset: 0; background: radial-gradient(60% 70% at 70% 40%, #fff6c9 0%, #f8f5ec 60%), #f8f5ec; }
canvas { position: absolute; inset: 0; }
.cap { position: absolute; left: 64px; top: 56px; max-width: 760px; font-weight: 600; font-size: 64px; line-height: 1.02; letter-spacing: -0.02em; color: #1c2230; opacity: 0; transform: translateY(24px); }
.cap small { display: block; margin-top: 14px; font-size: 30px; font-weight: 500; color: #3a4252; letter-spacing: 0; }
.cap mark { background: #f6d84a; color: inherit; padding: 0 10px; border-radius: 10px; }
#end { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; background: #1c2230; color: #f8f5ec; opacity: 0; text-align: center; }
#end img { width: 250px; padding: 22px 26px; border-radius: 28px; background: #fbf9f3; transform: rotate(-2deg); }
#end h2 { margin: 8px 0 0; font-size: 60px; font-weight: 600; letter-spacing: -0.02em; }
#end p { margin: 0; font-size: 30px; font-weight: 500; color: #d9dbe2; }
#end .url { margin-top: 8px; display: inline-block; padding: 12px 30px; border-radius: 18px; background: #f6d84a; color: #1c2230; font-weight: 600; font-size: 34px; box-shadow: 0 6px 0 #c9a925; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c" width="1280" height="720"></canvas>
<div class="cap" id="cap1">Meet <mark>SpatialSprout 3D</mark><small>Interactive books for curious kids</small></div>
<div class="cap" id="cap2">Lessons pop right off the page<small>Letters, numbers, science and more</small></div>
<div class="cap" id="cap3">Read it, build it, love it<small>Junior Kindergarten to Grade 8</small></div>
<div id="end"><img src="../../assets/img/logo-teal.png" alt=""><h2>Try a book today</h2><p>Built on the Ontario curriculum</p><span class="url">spatialsprout.ca</span></div>
<script src="/vendor-three.js"></script>
<script src="../bookkit/gltf-loader.js"></script>
<script src="../bookkit/meshopt-decoder.js"></script>
<script>
(async function () {
  const Q = new URLSearchParams(location.search);
  const CLIP = Q.get("clip") || "frames"; const NCLIP = +(Q.get("n") || 300); const CLIP_FPS = +(Q.get("cfps") || 30);
  const W = 1280, H = 720, DUR = 16;
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfb8, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-4, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); sun.shadow.radius = 6; scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  const loader = new THREE.GLTFLoader(); if (window.MeshoptDecoder) loader.setMeshoptDecoder(window.MeshoptDecoder);
  const load = (u) => new Promise((ok, no) => loader.load(u, ok, undefined, no));

  /* the kid: a cartoon child built from simple shapes */
  const M = (c, r = 0.6) => { const m = new THREE.MeshStandardMaterial({ color: c, roughness: r }); m.color.convertSRGBToLinear(); return m; };
  const SKIN = M(0xf3c39d, 0.55), HAIR = M(0x5a3522, 0.7), SHIRT = M(0xf6c83a, 0.6), PANTS = M(0x3b6fd1, 0.65), SHOE = M(0xe8564a, 0.5), DARK = M(0x241a1a, 0.3), WHITE = M(0xffffff, 0.2), CHEEK = new THREE.MeshStandardMaterial({ color: new THREE.Color(0xff8f9b).convertSRGBToLinear(), roughness: 0.6, transparent: true, opacity: 0.6 });
  const sph = (r, m, ws = 32) => { const o = new THREE.Mesh(new THREE.SphereGeometry(r, ws, ws * 0.75), m); o.castShadow = true; return o; };
  const cap = (r, len, m) => { const g = new THREE.Group(); const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 24), m); c.position.y = -len / 2; c.castShadow = true; g.add(c); const e = sph(r, m, 20); e.position.y = -len; g.add(e); const t = sph(r, m, 20); g.add(t); return g; };
  const kidRoot = new THREE.Group(); scene.add(kidRoot);
  const kidBody = new THREE.Group(); kidRoot.add(kidBody);
  const legs = [-1, 1].map((s) => { const l = cap(0.11, 0.5, PANTS); l.position.set(s * 0.13, 0.66, 0); const shoe = sph(0.13, SHOE); shoe.scale.set(1, 0.6, 1.45); shoe.position.set(0, -0.56, 0.06); l.add(shoe); kidBody.add(l); return l; });
  const torso = sph(0.3, SHIRT); torso.scale.set(1, 1.15, 0.85); torso.position.y = 0.95; kidBody.add(torso);
  const belly = new THREE.Mesh(new THREE.CylinderGeometry(0.255, 0.27, 0.12, 32), PANTS); belly.position.y = 0.68; kidBody.add(belly);
  const star = sph(0.07, WHITE); star.scale.set(1, 1, 0.3); star.position.set(0, 1.0, 0.255); kidBody.add(star);
  const arms = [-1, 1].map((s) => { const sh = new THREE.Group(); sh.position.set(s * 0.3, 1.18, 0); const up = cap(0.085, 0.24, SHIRT); sh.add(up); const el = new THREE.Group(); el.position.y = -0.26; sh.add(el); const lo = cap(0.075, 0.2, SKIN); el.add(lo); const hand = sph(0.09, SKIN); hand.position.y = -0.24; el.add(hand); kidBody.add(sh); return { sh, el }; });
  const headP = new THREE.Group(); headP.position.y = 1.3; kidBody.add(headP);
  const head = sph(0.4, SKIN, 48); head.position.y = 0.36; headP.add(head);
  const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.425, 48, 32, 0, Math.PI * 2, 0, Math.PI * 0.52), HAIR); hairCap.position.y = 0.38; hairCap.rotation.x = -0.32; hairCap.castShadow = true; headP.add(hairCap);
  [[-0.17, 0.62, 0.3, 0.13], [0.0, 0.66, 0.33, 0.14], [0.17, 0.62, 0.3, 0.13]].forEach((b) => { const o = sph(b[3], HAIR); o.position.set(b[0], b[1], b[2]); o.scale.set(1.2, 0.7, 0.8); headP.add(o); });
  [-1, 1].forEach((s) => { const puff = sph(0.15, HAIR); puff.position.set(s * 0.44, 0.52, -0.05); headP.add(puff); const tie = sph(0.05, SHOE); tie.position.set(s * 0.36, 0.5, -0.03); headP.add(tie); });
  const eyes = [-1, 1].map((s) => { const e = new THREE.Group(); e.position.set(s * 0.14, 0.4, 0.355); const ball = sph(0.065, DARK); ball.scale.set(0.85, 1.1, 0.5); e.add(ball); const hi = sph(0.02, WHITE); hi.position.set(0.02, 0.03, 0.03); e.add(hi); headP.add(e); return e; });
  [-1, 1].forEach((s) => { const c = sph(0.07, CHEEK); c.scale.set(1.2, 0.75, 0.3); c.position.set(s * 0.23, 0.27, 0.33); headP.add(c); });
  const nose = sph(0.035, SKIN); nose.position.set(0, 0.31, 0.4); headP.add(nose);
  const smile = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.017, 10, 32, Math.PI), DARK); smile.rotation.z = Math.PI; smile.position.set(0, 0.22, 0.375); headP.add(smile);
  const mouthO = new THREE.Mesh(new THREE.CircleGeometry(0.09, 32, Math.PI, Math.PI), M(0x7a1f2b, 0.5)); mouthO.position.set(0, 0.215, 0.388); headP.add(mouthO);
  const tongue = new THREE.Mesh(new THREE.CircleGeometry(0.045, 24, Math.PI, Math.PI), M(0xff7c8a, 0.5)); tongue.position.set(0, 0.165, 0.392); headP.add(tongue);
  kidRoot.scale.setScalar(1.05);
  function kidPose(t) {
    const wave = t < 3.3, watch = t >= 3.3 && t < 9.6, jump = t >= 9.6;
    const bob = Math.sin(t * 5.2) * 0.02;
    let y = 0, lift = 0;
    if (jump) { const ph = ((t - 9.6) % 0.62) / 0.62; lift = Math.sin(ph * Math.PI) * 0.42; y = lift; }
    kidBody.position.y = y + (jump ? 0 : Math.abs(bob));
    legs[0].rotation.x = jump ? -0.35 * Math.sin(((t - 9.6) % 0.62) / 0.62 * Math.PI) : Math.sin(t * 5.2) * 0.05; legs[1].rotation.x = jump ? 0.15 : -Math.sin(t * 5.2) * 0.05;
    /* arms */
    const L = arms[0], R = arms[1];
    if (wave) { R.sh.rotation.set(0, 0, 2.6); R.el.rotation.set(0, 0, 0.35 + Math.sin(t * 11) * 0.45); L.sh.rotation.set(0.1, 0, -0.2); L.el.rotation.set(-0.3, 0, 0); }
    else if (watch) { const k = Math.min(1, (t - 3.3) / 0.4); const clap = Math.max(0, Math.sin(t * 9)) * (t > 4.2 && t < 7.8 ? 1 : 0.2);
      L.sh.rotation.set(-1.0 * k, 0, -0.35 + clap * 0.25); L.el.rotation.set(-1.1 * k, 0, 0.6 * k); R.sh.rotation.set(-1.0 * k, 0, 0.35 - clap * 0.25); R.el.rotation.set(-1.1 * k, 0, -0.6 * k); }
    else { const p = Math.sin(((t - 9.6) % 0.62) / 0.62 * Math.PI); L.sh.rotation.set(0, 0, -2.5 - p * 0.3); R.sh.rotation.set(0, 0, 2.5 + p * 0.3); L.el.rotation.set(0, 0, -0.3); R.el.rotation.set(0, 0, 0.3); }
    /* head */
    headP.rotation.set(watch ? -0.05 + Math.sin(t * 3) * 0.06 : Math.sin(t * 2) * 0.04, watch ? 0.55 : 0, Math.sin(t * 2.3) * 0.08);
    const blink = [1.6, 5.1, 8.3, 11.4].some((b) => Math.abs(t - b) < 0.07); eyes.forEach((e) => e.scale.y = blink ? 0.12 : 1);
    const open = jump || (watch && t > 4.1 && t < 8.6) || (wave && t > 0.9 && t < 2.6);
    const amt = open ? (jump ? 0.85 + Math.sin(t * 14) * 0.15 : 0.7 + Math.sin(t * 9) * 0.2) : 0;
    smile.visible = !open; mouthO.visible = tongue.visible = open; mouthO.scale.set(1, Math.max(0.3, amt) * 1.3, 1); tongue.scale.setScalar(Math.max(0.3, amt));
  }
  /* the tablet */
  const TW = 2.4, TH = 1.5;
  function rrect(w, h, r) { const s = new THREE.Shape(); s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r); s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2); return s; }
  const tab = new THREE.Group(); scene.add(tab);
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rrect(TW + 0.16, TH + 0.16, 0.14), { depth: 0.08, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 3 }), M(0x2a3142, 0.5));
  body.castShadow = true; body.position.z = -0.09; tab.add(body);
  const img = new Image(); const tex = new THREE.Texture(img); tex.encoding = THREE.sRGBEncoding;
  const screen = new THREE.Mesh(new THREE.ShapeGeometry(rrect(TW, TH, 0.06)), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  { const uv = screen.geometry.attributes.uv, pos = screen.geometry.attributes.position; for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / TW + 0.5, pos.getY(i) / TH + 0.5); }
  screen.position.z = 0.015; tab.add(screen);
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.0, 12), body.material); stand.position.set(0, -1.15, -0.2); stand.castShadow = true; tab.add(stand);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.06, 32), body.material); foot.position.set(0, -1.65, -0.2); foot.castShadow = true; tab.add(foot);

  /* friends that pop out of the book */
  const names = ["apple", "heart", "ice-cream", "orange", "bee", "book"];
  const pops = [];
  for (let i = 0; i < names.length; i++) {
    const g = (await load("../../books/kindergarten-jk/models/" + names[i] + ".glb")).scene;
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    const b = new THREE.Box3().setFromObject(g); const s = Math.max(b.max.x - b.min.x, b.max.y - b.min.y, b.max.z - b.min.z);
    const w = new THREE.Group(); const c = new THREE.Vector3(); b.getCenter(c); g.position.sub(c); g.scale.multiplyScalar(1); w.add(g);
    w.userData.base = 0.55 / s; w.visible = false; scene.add(w); pops.push(w);
  }
  const TARGETS = [[3.2, 2.55, 0.7], [2.2, 2.95, 0.4], [1.2, 2.55, 0.6], [3.4, 1.2, 1.0], [0.5, 1.6, 1.4], [1.5, 0.3, 1.7]];

  /* confetti */
  const COLS = [0xf6d84a, 0x3b7be0, 0xf06a5a, 0x5fd08b, 0xb07cff];
  const conf = []; const cg = new THREE.PlaneGeometry(0.06, 0.1);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 140; i++) { const m = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({ color: COLS[i % 5], side: THREE.DoubleSide })); m.userData = { t0: i < 70 ? 4.2 : 10.0, v: new THREE.Vector3((rnd() - 0.5) * 5, 3 + rnd() * 3.5, (rnd() - 0.3) * 3), r: new THREE.Vector3(rnd() * 9, rnd() * 9, rnd() * 9) }; m.visible = false; scene.add(m); conf.push(m); }

  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const spring = (x) => { x = Math.min(1, Math.max(0, x)); return 1 - Math.cos(x * Math.PI * 4.5) * Math.exp(-x * 6); };
  const lerp = (a, b, k) => a + (b - a) * k;
  function capShow(id, t, a, b) { const e = document.getElementById(id); const k = t < a ? 0 : t < a + 0.5 ? (t - a) / 0.5 : t < b - 0.4 ? 1 : t < b ? (b - t) / 0.4 : 0; e.style.opacity = k; e.style.transform = "translateY(" + (1 - ease(k)) * 24 + "px)"; }
  function weights(map) { for (const k in acts) acts[k].weight = map[k] || 0; }
  const TABX = 2.2;

  async function frame(t) {
    kidPose(t);
    const kin = ease(t / 0.9);
    kidRoot.position.set(lerp(-3.6, -0.9, kin), 0, 0.6);
    kidRoot.rotation.y = t < 3.3 ? 0.2 : t < 9.6 ? lerp(0.2, 0.45, ease((t - 3.3) / 0.6)) : lerp(0.45, 0.15, ease((t - 9.6) / 0.5));
    /* tablet springs in */
    const ts = spring((t - 0.5) / 1.4);
    tab.position.set(TABX, 1.75, -0.2); tab.scale.setScalar(Math.max(0.001, ts)); tab.rotation.y = lerp(-0.9, -0.32, ease((t - 0.5) / 1.2)) + Math.sin(t * 1.3) * 0.02;
    /* screen plays the real book clip */
    const fi = Math.min(NCLIP - 1, Math.max(0, Math.floor(Math.max(0, t - 1.0) * CLIP_FPS)));
    const src = CLIP + "/" + String(fi).padStart(4, "0") + ".jpg";
    if (img.getAttribute("src") !== src) { await new Promise((ok) => { img.onload = ok; img.onerror = ok; img.src = src; }); tex.needsUpdate = true; }
    /* friends pop out */
    pops.forEach((p, i) => {
      const t0 = 4.2 + i * 0.55; const k = (t - t0) / 1.0;
      if (k <= 0) { p.visible = false; return; }
      p.visible = true;
      const tg = TARGETS[i]; const e = ease(k);
      p.position.set(lerp(TABX, tg[0], e), lerp(1.75, tg[1], e) + Math.sin(e * Math.PI) * 0.6 + (k > 1 ? Math.sin((t - t0) * 2 + i) * 0.06 : 0), lerp(0.1, tg[2], e));
      p.scale.setScalar(p.userData.base * Math.max(0.001, spring(k)));
      p.rotation.y = (t - t0) * 1.2 + i;
    });
    /* confetti, simple ballistic */
    conf.forEach((m) => { const d = t - m.userData.t0; if (d < 0 || d > 3.2) { m.visible = false; return; } m.visible = true; const v = m.userData.v;
      const o = m.userData.t0 < 5 ? [TABX, 2.0, 0.3] : [-0.9, 1.4, 0.8];
      m.position.set(o[0] + v.x * d * 0.6, o[1] + v.y * d - 4.2 * d * d, o[2] + v.z * d * 0.6); m.rotation.set(m.userData.r.x * d, m.userData.r.y * d, m.userData.r.z * d); });
    /* camera: wide, then push toward the tablet, then settle on the kid */
    const k1 = ease((t - 3.0) / 2.0), k2 = ease((t - 9.2) / 1.6);
    const px = lerp(lerp(0.9, 1.25, k1), 0.9, k2), py = lerp(lerp(2.3, 2.0, k1), 2.1, k2), pz = lerp(lerp(10.5, 8.2, k1), 11.2, k2);
    cam.position.set(px, py, pz); cam.lookAt(lerp(lerp(0.9, 1.35, k1), 1.0, k2), lerp(lerp(1.45, 1.7, k1), 1.85, k2), 0);
    /* captions and the end card */
    capShow("cap1", t, 0.6, 3.3); capShow("cap2", t, 4.0, 9.3); capShow("cap3", t, 9.8, 12.8);
    const ek = ease((t - 12.8) / 0.6); const end = document.getElementById("end"); end.style.opacity = ek; end.style.transform = "translateY(" + (1 - ek) * 30 + "px)";
    renderer.render(scene, cam);
  }
  window.AD = { frame, DUR };
  document.title = "ready";
})().catch((e) => { document.title = "error " + e; console.error(e); });
</script>
</body>
</html>
